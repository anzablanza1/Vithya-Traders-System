<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vithya — Counter</title>
<style>
:root{
  --brand:#CC3018; --brand-d:#A72410; --brand-l:#FBEDEA; --stone:#6C6C60; --stone-l:#F2F1EE;
  --w:#1D5FA8; --w-l:#E9F0F9;
  --ink:#1A1A17; --ink2:#4A4A42; --ink3:#8A8A7E; --line:#E2E0DA; --line2:#F0EFEB;
  --bg:#F6F5F2; --card:rgba(255,255,255,.86);
  --green:#2C6B4A; --green-bg:#E9F3ED; --amber:#A8730F; --amber-bg:#FDF5E4;
  --red:#B3372C; --red-bg:#FBEEEC;
  --glass:saturate(160%) blur(18px);
  --sh:0 1px 2px rgba(26,26,23,.05),0 8px 28px rgba(26,26,23,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 10% -6%, rgba(204,48,24,.10), transparent 60%),
    radial-gradient(800px 460px at 95% 3%, rgba(108,108,96,.12), transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:rgba(255,255,255,.74);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);border-bottom:1px solid rgba(226,224,218,.85);flex:0 0 auto}
.logo{height:26px;display:block}
.bsub{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--stone);
  font-weight:700;border-left:1px solid var(--line);padding-left:10px}
.spacer{flex:1}
.ico{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  cursor:pointer;color:var(--ink2)}

.tabs{display:flex;gap:4px;padding:8px 12px;background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border-bottom:1px solid rgba(226,224,218,.7);flex:0 0 auto;overflow-x:auto}
.tab{padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:650;
  white-space:nowrap}
.tab.on{background:var(--brand);color:#fff}
.tab .pill{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;
  background:rgba(0,0,0,.12);font-size:11px;font-weight:750}
.tab.on .pill{background:rgba(255,255,255,.3)}

.view{flex:1;overflow:auto;padding:14px}
.sbar{padding:12px 14px 6px;position:sticky;top:0;z-index:5;
  background:linear-gradient(rgba(246,245,242,.97),rgba(246,245,242,.86))}
.sbar input{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;
  font-size:17px;outline:none;background:#fff}
.sbar input:focus{border-color:var(--brand)}
.srow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.srow select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.tog{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2)}

.res{padding:0 14px 14px}
.p{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid rgba(226,224,218,.9);border-radius:13px;padding:13px 15px;margin-bottom:9px;
  display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--sh)}
.p:active{transform:scale(.995)}
.p .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.p .dot.y{background:var(--green)} .p .dot.n{background:var(--red)}
.p .mid{flex:1;min-width:0}
.p .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p .cd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink3);margin-top:2px}
.p .rt{text-align:right;white-space:nowrap}
.p .pr{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.p .st{font-size:12px;margin-top:1px}
.st.y{color:var(--green);font-weight:650} .st.n{color:var(--red);font-weight:650}

/* detail */
.dh{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;flex:0 0 auto;max-width:52%}
.th{width:88px;height:88px;border-radius:11px;overflow:hidden;border:1px solid var(--line);
  background:var(--stone-l);flex:0 0 auto;cursor:zoom-in}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{width:88px;height:88px;border-radius:11px;border:1px dashed var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11px;
  text-align:center;padding:6px;flex:0 0 auto}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.pc.w{border-top:3px solid var(--w)} .pc.wo{border-top:3px solid var(--brand)}
.pc .l{font-size:10.5px;font-weight:750;letter-spacing:.5px;text-transform:uppercase}
.pc.w .l{color:var(--w)} .pc.wo .l{color:var(--brand)}
.pc .v{font-size:25px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stock{border-radius:12px;padding:13px 15px;margin-bottom:14px;font-weight:650}
.stock.y{background:var(--green-bg);color:var(--green);border:1px solid #BFD9C9}
.stock.n{background:var(--red-bg);color:var(--red);border:1px solid #E8BDB7}
.stock .big{font-size:22px;font-weight:750}
.desc{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.act{padding:13px;border-radius:11px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-weight:650;text-align:center}
.act:active{background:var(--stone-l)}
.act.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.alts{margin-top:16px}
.alt{display:flex;gap:11px;align-items:center;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;background:#fff;cursor:pointer}

.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  font-weight:750;margin:0 0 9px}
.cap{background:var(--card);border:1px solid rgba(226,224,218,.9);border-radius:12px;
  padding:11px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.cap .t{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.4px}
.t-no_stock{color:var(--red)} .t-request{color:var(--brand)}
.t-enquiry{color:var(--w)} .t-feedback{color:var(--amber)}
.cap .m{font-weight:600;margin-top:2px}
.cap .s{font-size:12px;color:var(--ink3);margin-top:2px}

.ov{position:fixed;inset:0;background:rgba(26,26,23,.4);display:none;z-index:60;
  align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:620px;
  max-height:92vh;overflow:auto;box-shadow:0 -8px 40px rgba(0,0,0,.22)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  position:sticky;top:0;background:#fff;z-index:2}
.sh h3{margin:0;font-size:16px;font-weight:750;flex:1;overflow:hidden;text-overflow:ellipsis}
.sb{padding:16px 18px 24px}
.x{cursor:pointer;color:var(--ink3);font-size:26px;line-height:1;padding:0 6px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--ink2);font-weight:650;margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:10px;outline:none}
.fld textarea{min-height:70px;resize:vertical}
.btn{padding:13px 18px;border-radius:11px;border:none;cursor:pointer;font-weight:700;width:100%}
.btn.p{background:var(--brand);color:#fff}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.lb{position:fixed;inset:0;background:rgba(20,18,16,.9);display:none;align-items:center;
  justify-content:center;z-index:200}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:88vh;border-radius:10px}

.empty{padding:46px 18px;text-align:center;color:var(--ink3)}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:13px 22px;border-radius:11px;font-size:14px;z-index:220;display:none}
.toast.on{display:block}
.toast.err{background:var(--red)}

.ptag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;
  font-weight:750;margin:0 4px 3px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptag.pw{background:#E9F0F9;color:#1D5FA8}
.ptag.pwx{background:#F2F6FB;color:#5C82AD;font-weight:600}
.ptag.pwo{background:#FBEDEA;color:#CC3018}
.ptag.pnone{background:var(--stone-l);color:var(--ink3);font-weight:600}
.pricebox{display:flex;flex-wrap:wrap;gap:0;margin-top:4px}
.dchip{display:inline-block;padding:1px 8px;border-radius:20px;font-size:10.5px;
  font-weight:750;margin-right:5px}
.d-no_stock{background:#FBEEEC;color:#B3372C}
.d-request{background:#FBEDEA;color:#CC3018}
.d-enquiry{background:#E9F0F9;color:#1D5FA8}
.d-feedback{background:#FDF5E4;color:#A8730F}
.why{font-size:11.5px;color:var(--ink2);margin-top:3px}
.why b{color:var(--brand-d)}

.qbar{display:flex;gap:7px;align-items:center;padding:10px 14px;flex-wrap:wrap;
  background:rgba(255,255,255,.72);border-bottom:1px solid var(--line)}
.qbar select,.qbar input{padding:8px 11px;border:1.5px solid var(--line);
  border-radius:9px;background:#fff;outline:none;font-size:14px}
.qrow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line2);
  background:var(--card)}
.qrow.sel{background:#E9F3ED}
.qrow .qn{flex:1;min-width:0}
.qrow .qn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .qn span{font-size:11.5px;color:var(--ink3)}
.qcell{text-align:right;min-width:86px;font-variant-numeric:tabular-nums}
.qcell .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:750}
.qcell .v{font-size:14px;font-weight:750}
.qcell.was .v{color:var(--w)} .qcell.now .v{color:var(--ink2)}
.qup{color:var(--green);font-size:11px;font-weight:700}
.qdn{color:var(--red);font-size:11px;font-weight:700}
.qin{width:78px;text-align:right;padding:6px 8px;border:1.5px solid var(--line);
  border-radius:8px;font-weight:750;font-variant-numeric:tabular-nums}
.qin.edited{border-color:var(--amber);background:var(--amber-bg)}
.qtot{position:sticky;bottom:0;background:var(--ink);color:#fff;padding:12px 15px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtot b{font-size:17px}
.qout{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
  padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.sortbar{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;align-items:center;
  background:rgba(255,255,255,.6);border-bottom:1px solid var(--line2)}
.sortbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.newtag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:750;
  background:#EDE8FA;color:#6A4FB5;margin-left:5px}

/* ── landing page ── */
.hero{padding:26px 18px 8px;text-align:center}
.hero .hi{font-size:26px;font-weight:750;letter-spacing:-.5px}
.hero .sub{font-size:14px;color:var(--ink2);margin-top:4px}
.bigsearch{margin:18px 16px 8px;position:relative}
.bigsearch input{width:100%;padding:18px 20px 18px 52px;font-size:17px;
  border:2px solid var(--line);border-radius:16px;background:var(--card);
  outline:none;box-shadow:0 2px 10px rgba(26,26,23,.04)}
.bigsearch input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.bigsearch .mag{position:absolute;left:19px;top:50%;transform:translateY(-50%);
  font-size:20px;opacity:.4}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 20px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:18px 16px;cursor:pointer;text-align:left;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px;line-height:1}
.tile .tl{font-size:16px;font-weight:750;margin-top:8px}
.tile .ts{font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.tile .cnt{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:20px;
  font-size:12px;font-weight:750;background:var(--stone-l);color:var(--ink2)}
.tile.urgent{border-color:#E8BDB7;background:var(--red-bg)}
.tile.urgent .cnt{background:var(--brand);color:#fff}
.tile.wide{grid-column:1 / -1}
.hstat{display:flex;gap:10px;padding:0 16px 18px}
.hstat div{flex:1;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:13px;text-align:center}
.hstat .n{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.hstat .l{font-size:11px;color:var(--ink3);margin-top:2px}
@media(min-width:720px){
  .tiles{grid-template-columns:repeat(3,1fr);max-width:900px;margin:0 auto}
  .bigsearch{max-width:640px;margin-left:auto;margin-right:auto}
  .hstat{max-width:900px;margin:0 auto}
}

.qcell.pick{outline:2px solid var(--brand);outline-offset:-2px;border-radius:8px}
.qcell.pick .l{color:var(--brand);font-weight:800}
.lanetag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:10.5px;font-weight:800}
.lanetag.w{background:#E9F0F9;color:#1D5FA8}
.lanetag.wo{background:#FBEDEA;color:#CC3018}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <div class="top">
    <img class="logo" id="logo" alt="Vithya Traders">
    <span class="bsub">Counter</span>
    <div class="spacer"></div>
    <button class="ico" id="stockBtn" title="Refresh stock from Vasy"
      style="width:auto;padding:0 12px;font-size:12.5px;font-weight:700">&#8635; Stock</button>
    <button class="ico" id="poTop" title="Open the PO request app"
      style="width:auto;padding:0 14px;font-size:13px;font-weight:750">&#43; PO</button>
    <button class="ico" id="btnConn">&#9881;</button>
  </div>
  <div class="tabs">
    <div class="tab on" data-v="home">Home</div>
    <div class="tab" data-v="find">Search</div>
    <div class="tab" data-v="browse">All items</div>
    <div class="tab" data-v="quote">Price list <span class="pill" id="nQuote"></span></div>
    <div class="tab" data-v="alert">To do <span class="pill" id="nAlert"></span></div>
    <div class="tab" data-v="log">My notes <span class="pill" id="nLog"></span></div>
    <div class="tab" data-v="count">Counting <span class="pill" id="nCount"></span></div>
  </div>

  <div class="view" id="vHome"></div>

  <div class="view" id="vFind" style="display:none;padding:0">
    <div class="sbar">
      <input type="text" id="q" placeholder="Search product..." autocomplete="off">
      <div class="srow">
        <select id="fcat"><option value="">All categories</option></select>
        <select id="fsub"><option value="">All subcategories</option></select>
        <select id="fbrand"><option value="">All brands</option></select>
        <label class="tog"><input type="checkbox" id="fstock"> In stock only</label>
        <div class="spacer"></div>
        <button class="act" style="padding:8px 13px" id="btnAsk">Log a request</button>
      </div>
      <div class="tog" style="margin-top:6px;font-size:11.5px;color:var(--ink3)">
        <span id="catMeta">loading catalogue…</span>
        <button class="act" style="padding:3px 9px;font-size:11px" id="btnRefreshCat">refresh</button>
      </div>
    </div>
    <div class="res" id="res"><div class="empty">Type to search.</div></div>
  </div>

  <div class="view" id="vBrowse" style="display:none;padding:0"></div>
  <div class="view" id="vQuote" style="display:none;padding:0"></div>
  <div class="view" id="vAlert" style="display:none"></div>
  <div class="view" id="vLog" style="display:none"></div>
  <div class="view" id="vCount" style="display:none"></div>
</div>

<div class="ov on" id="ovConn"><div class="sheet">
  <div class="sh"><h3>Connect</h3></div>
  <div class="sb">
    <div class="fld"><label>Web app URL</label>
      <input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="fld"><label>Floor token</label><input id="cTok" placeholder="VT_FLOOR_TOKEN"></div>
    <div class="fld"><label>Your name</label><input id="cWho" placeholder="so requests are attributed"></div>
    <div class="fld"><label>PO request app link (optional)</label>
      <input id="cPo" placeholder="https://script.google.com/…/exec">
      <div style="font-size:11.5px;color:var(--ink3);margin-top:4px">Lets the
        Request button open the PO app with the product already filled in.</div></div>
    <div id="cMsg" style="font-size:12.5px;color:var(--ink3)"></div>
    <div style="margin-top:14px"><button class="btn p" id="cSave">Connect</button></div>
  </div>
</div></div>

<div class="ov" id="ovDet"><div class="sheet">
  <div class="sh"><h3 id="dT"></h3><span class="x" id="dX">&times;</span></div>
  <div class="sb" id="dB"></div>
</div></div>

<div class="ov" id="ovCap"><div class="sheet">
  <div class="sh"><h3 id="capT"></h3><span class="x" id="capX">&times;</span></div>
  <div class="sb" id="capB"></div>
</div></div>

<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<div class="toast" id="toast"></div>
<script>
var CFG={url:localStorage.getItem('vtf_url')||'',token:localStorage.getItem('vtf_tok')||'',
  who:localStorage.getItem('vtf_who')||''};
var SEQ=0;
function api(action,params,ok,fail){
  if(!CFG.url||!CFG.token){fail&&fail('Not connected');return;}
  var cb='vtf'+(++SEQ)+'_'+Date.now(),done=false,s=document.createElement('script');
  var t=setTimeout(function(){if(done)return;done=true;clean();fail&&fail('Timed out');},30000);
  function clean(){try{delete window[cb]}catch(e){window[cb]=undefined}
    if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(t);}
  window[cb]=function(r){if(done)return;done=true;clean();
    if(r&&r.ok)ok&&ok(r.data);else fail&&fail(r&&r.error?r.error:'Error');};
  var qs=['app=floor','action='+encodeURIComponent(action),
    'token='+encodeURIComponent(CFG.token),'callback='+cb];
  for(var k in params){var v=params[k];
    if(v!==undefined&&v!==null&&v!=='')qs.push(k+'='+encodeURIComponent(v));}
  s.src=CFG.url+(CFG.url.indexOf('?')<0?'?':'&')+qs.join('&');
  s.onerror=function(){if(done)return;done=true;clean();fail&&fail('Could not reach the URL');};
  document.body.appendChild(s);
}
function $(i){return document.getElementById(i)}
/* takes a NodeList. This was missing entirely, so every alert click handler
   threw and the buttons did nothing — the "stuck" tabs. */
function each(sel,fn){
  var l = (typeof sel==='string') ? document.querySelectorAll(sel) : sel;
  if(!l) return;
  for(var i=0;i<l.length;i++) fn(l[i]);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,e){var t=$('toast');t.textContent=m;t.className='toast on'+(e?' err':'');
  setTimeout(function(){t.className='toast'},e?4500:2400)}
function rs(v){if(v===''||v===null||v===undefined||isNaN(v)||Number(v)===0)return '—';
  return '\u20B9'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
/* W is quoted INCLUDING GST; the ex-GST figure is derived, never stored twice */
function exGst(inc,gst){var i=Number(inc),g=Number(gst);
  if(!isFinite(i)||!i)return '';
  if(!isFinite(g)||!g)return i;
  return i/(1+g/100);}
function priceTags(w,wo,gst){
  var out='';
  if(w){out+='<span class="ptag pw">W '+rs(w)+'</span>';
    var ex=exGst(w,gst);

function start(){
  api('init',{},function(d){
    var f=$('fcat');f.length=1;
    d.categories.forEach(function(c){var o=document.createElement('option');
      o.value=c;o.textContent=c;f.appendChild(o);});
    $('ovConn').className='ov';$('app').style.display='flex';
    drawHome();loadBadges();
    loadCatalog(false);
    setTimeout(fillFilters,1200);
  },function(e){$('cMsg').textContent=e;});
}

var tabs=document.querySelectorAll('.tab');
for(var i=0;i<tabs.length;i++){
  tabs[i].onclick=function(){
    for(var j=0;j<tabs.length;j++)tabs[j].className='tab';
    this.className='tab on';
    VIEW=this.getAttribute('data-v');
    $('vHome').style.display=VIEW==='home'?'block':'none';
    if(VIEW==='home')drawHome();
    $('vFind').style.display=VIEW==='find'?'block':'none';
    if(VIEW==='find')setTimeout(function(){var q=$('q');if(q)q.focus()},60);
    $('vBrowse').style.display=VIEW==='browse'?'block':'none';
    $('vQuote').style.display=VIEW==='quote'?'block':'none';
    $('vAlert').style.display=VIEW==='alert'?'block':'none';
    if(VIEW==='browse')drawBrowse();
    if(VIEW==='quote')drawQuote();
    $('vLog').style.display=VIEW==='log'?'block':'none';
    $('vCount').style.display=VIEW==='count'?'block':'none';
    if(VIEW==='alert')loadAlerts();
    if(VIEW==='log')loadLog();
    if(VIEW==='count')loadCount();
  };
}

var ST=null;
$('q').oninput=function(){
  if(CIX){ search(); return; }          /* local — no debounce, no wait */
  if(ST)clearTimeout(ST); ST=setTimeout(search,300);
};
$('fcat').onchange=search;$('fstock').onchange=search;
if($('fbrand'))$('fbrand').onchange=search;
if($('fsub'))$('fsub').onchange=search;
if($('btnRefreshCat'))$('btnRefreshCat').onclick=function(){
  this.textContent='…'; loadCatalog(true);
  var b=this; setTimeout(function(){b.textContent='refresh'},1500);
};
$('stockBtn').onclick=refreshStock;
$('poTop').onclick=function(){
  var base=(localStorage.getItem('vtf_po')||'').trim();
  if(!base){ toast('Add the PO request app link in settings',true);
    $('ovConn').className='ov on'; return; }
  window.open(base,'_blank');   /* the real PO app, in its own tab */
};

function search(){
  var q=$('q').value.trim(), c=$('fcat').value;
  var b=$('fbrand')?$('fbrand').value:'', sb=$('fsub')?$('fsub').value:'';
  if(q.length<1&&!c&&!b&&!sb){
    $('res').innerHTML='<div class="empty">Type to search.</div>';return;}
  var local=localSearch(q,c,b,sb,$('fstock').checked);
  if(local){ drawResults(local); return; }
  /* the catalogue has not arrived yet — fall back to the server once */
  api('search',{q:q,cat:c,stock:$('fstock').checked?'1':''},function(d){
    drawResults({items:(d.items||[]).map(function(x){
      return [x.code,x.name,x.cat,'',x.brand,x.qty,x.w,x.wo,0,x.movement||'',
        x.cover||'',0,x.coming||0,x.due||''];
    }), total:d.total});
  },function(e){$('res').innerHTML='<div class="empty">'+esc(e)+'</div>'});
}

function drawResults(d){
  if(!d.items.length){
    $('res').innerHTML='<div class="empty">Nothing found.<br><br>'+
      '<button class="act pri" style="max-width:260px;margin:0 auto" onclick="askFree()">'+
      'Log what the customer asked for</button></div>';
    return;
  }
  var h='';
  d.items.forEach(function(r){
    var has=Number(r[C.QTY])>0;
    h+='<div class="p" data-c="'+esc(r[C.CODE])+'">'+
      '<span class="dot '+(has?'y':'n')+'"></span>'+
      '<div class="mid"><div class="nm">'+esc(r[C.NAME])+'</div>'+
      '<div class="cd">'+esc(r[C.CODE])+
        (r[C.BRAND]?'  ·  '+esc(r[C.BRAND]):'')+
        (r[C.SUB]?'  ·  '+esc(r[C.SUB]):'')+'</div>'+
      '<div class="pricebox">'+priceTags(r[C.W],r[C.WO],r[C.GST])+'</div></div>'+
      '<div class="rt">'+
      '<div class="st '+(has?'y':'n')+'">'+
        (has?qn(r[C.QTY])+(Number(r[C.COVER])>0?'  ·  '+Math.round(r[C.COVER])+'d':''):'no stock')+
      '</div>'+
      (Number(r[C.COMING])>0?'<div class="st y" style="font-size:11px;font-weight:600">'+
        qn(r[C.COMING])+' coming'+(r[C.DUE]?'<br>'+esc(r[C.DUE]):'')+'</div>':'')+
      '</div></div>';
  });
  if(d.total>d.items.length)h+='<div class="empty">'+d.total+
    ' matches, showing '+d.items.length+'. Narrow the search.</div>';
  $('res').innerHTML=h;
  each(document.querySelectorAll('.p[data-c]'),function(el){
    el.onclick=function(){openP(this.getAttribute('data-c'))}});
}

function openP(code){
  $('ovDet').className='ov on';$('dT').textContent=code;
  $('dB').innerHTML='<div class="empty"><div class="spin"></div>Loading...</div>';
  api('product',{code:code},function(p){
    CUR=p;$('dT').textContent=p.name;
    var th=p.images.length?p.images.map(function(u){
      return '<div class="th" data-img="'+esc(u)+'"><img src="'+esc(u)+'" alt=""></div>';
    }).join(''):'<div class="noimg">no image</div>';
    var alts='';
    if(!p.has&&p.alternatives.length){
      alts='<div class="alts"><div class="sec">In stock in the same category</div>'+
        p.alternatives.map(function(a){
          return '<div class="alt" data-alt="'+esc(a.code)+'">'+
            '<span class="dot y"></span><div class="mid"><div class="nm">'+esc(a.name)+
            '</div><div class="cd">'+esc(a.code)+'</div></div>'+
            '<div class="rt"><div class="pr" style="font-size:15px">'+rs(a.w)+'</div>'+
            '<div class="st y">'+qn(a.qty)+'</div></div></div>';
        }).join('')+'</div>';
    }
    $('dB').innerHTML=
      '<div class="dh"><div class="thumbs">'+th+'</div>'+
      '<div style="flex:1;min-width:0"><div class="cd" style="font-family:ui-monospace;'+
      'font-size:12px;color:var(--ink3)">'+esc(p.code)+'</div>'+
      (p.cat?'<div style="font-size:13px;color:var(--ink2);margin-top:3px">'+esc(p.cat)+
        (p.brand?' · '+esc(p.brand):'')+'</div>':'')+'</div></div>'+
      '<div class="stock '+(p.has?'y':'n')+'">'+
      (p.has?'<span class="big">'+qn(p.qty)+'</span> in stock':'Out of stock')+
      (p.cover!==''&&p.cover>0?'<span style="font-weight:600;font-size:13.5px;opacity:.85">'+
        '  ·  about '+Math.round(p.cover)+' days'+'</span>':'')+
      (p.movement?'<span style="font-weight:600;font-size:12.5px;opacity:.7">'+
        '  ·  '+esc(p.movement)+'</span>':'')+
      '</div>'+
      (p.po&&p.po.on_order>0?
        '<div class="stock y" style="margin-top:-8px">'+
        '<span class="big">'+qn(p.po.on_order)+'</span> on the way'+
        (p.po.next_due?'  ·  due '+esc(p.po.next_due):'')+
        (p.po.in_transit>0?'  ·  '+qn(p.po.in_transit)+' in transit':'')+
        '</div>':'')+
      '<div class="prices">'+
      '<div class="pc w"><div class="l">W · with GST</div><div class="v">'+rs(p.w)+'</div>'+
        (exGst(p.w,p.gst)?'<div style="font-size:12px;color:var(--w);opacity:.8">'+
          'ex GST '+rs(exGst(p.w,p.gst))+(p.gst?'  ·  '+p.gst+'%':'')+'</div>':'')+'</div>'+
      '<div class="pc wo"><div class="l">WO · non GST</div><div class="v">'+rs(p.wo)+'</div>'+
        '<div style="font-size:12px;color:var(--brand);opacity:.8">no tax component</div></div>'+
      '</div>'+
      demandBlock(p.demand)+
      poBlock(p.po)+
      (p.short||p.long?'<div class="desc">'+esc(p.short)+(p.long?'<br>'+esc(p.long):'')+'</div>':'')+
      '<div class="acts">'+
      (p.has?'':'<button class="act pri" onclick="poRequestCur()">Request this</button>')+
      (p.has?'':'<button class="act" onclick="cap(\'no_stock\')">Customer wanted it</button>')+
      '<button class="act" onclick="cap(\'enquiry\')">Enquiry only</button>'+
      '<button class="act" onclick="cap(\'feedback\')">Feedback</button>'+
      (p.has?'<button class="act" onclick="cap(\'no_stock\')">Not enough stock</button>':'')+
      '</div>'+alts;
    var t=document.querySelectorAll('.th[data-img]');
    for(var i=0;i<t.length;i++)t[i].onclick=function(){
      $('lbimg').src=this.getAttribute('data-img');$('lb').className='lb on';};
    var a=document.querySelectorAll('.alt[data-alt]');
    for(var j=0;j<a.length;j++)a[j].onclick=function(){openP(this.getAttribute('data-alt'))};
  },function(e){$('dB').innerHTML='<div class="empty">'+esc(e)+'</div>'});
}

var LABELS={no_stock:'Customer wanted this',request:'Product we do not stock',
  enquiry:'Enquiry',feedback:'Feedback'};
function cap(type){ openCap(type, CUR?CUR.code:'', CUR?CUR.name:''); }
function askFree(){ openCap('request','',''); }
$('btnAsk').onclick=function(){openCap('request','','')};

function openCap(type,code,name){
  $('ovCap').className='ov on';
  $('capT').textContent=LABELS[type]||type;
  $('capB').innerHTML=
    (name?'<div style="font-weight:650;margin-bottom:12px">'+esc(name)+'</div>':
      '<div class="fld"><label>What did they ask for?</label>'+
      '<input id="cpText" placeholder="describe it in your own words"></div>')+
    '<div class="fld"><label>Quantity wanted</label>'+
    '<input id="cpQty" inputmode="numeric" placeholder="optional"></div>'+
    '<div class="fld"><label>Customer</label>'+
    '<input id="cpCust" placeholder="name or shop, optional"></div>'+
    '<div class="fld"><label>Phone</label>'+
    '<input id="cpPh" inputmode="tel" placeholder="optional"></div>'+
    '<div class="fld"><label>Note</label>'+
    '<textarea id="cpNote" placeholder="anything worth remembering"></textarea></div>'+
    '<button class="btn p" id="cpGo">Save</button>';
  $('cpGo').onclick=function(){
    var text=$('cpText')?$('cpText').value.trim():'';
    if(!code&&!text){toast('Describe what they asked for',true);return;}
    this.disabled=true;this.textContent='Saving...';
    api('capture',{type:type,code:code,text:text,
      qty:$('cpQty').value.trim(),customer:$('cpCust').value.trim(),
      phone:$('cpPh').value.trim(),note:$('cpNote').value.trim(),by:CFG.who},
      function(){$('ovCap').className='ov';$('ovDet').className='ov';
        toast('Saved — thank you');loadBadges();},
      function(e){toast(e,true);var b=$('cpGo');if(b){b.disabled=false;b.textContent='Save'}});
  };
}

function loadBadges(){
  api('captures',{status:'open'},function(d){
    $('nLog').textContent=(d.counts.open||0)||'';
  },function(){});
  api('counts',{},function(d){

/* ══════════════════ PO REQUEST ══════════════════
   Opens the real PO request app with the product prefilled. We deliberately

function poRequest(code,name,qty,type){

  if(!base){

    $('ovConn').className='ov on';
    return;
  }
  var u=base+(base.indexOf('?')<0?'?':'&')+

    note:'sent to PO request app'},function(){loadBadges()},function(){});
}

/* ══════════════════ LOCAL CATALOGUE ══════════════════
   The counter cannot wait for a round trip per keystroke. The PO request app
   feels instant for one reason: it holds every product in the browser and
   searches locally. This does the same.

   Loaded once, kept in localStorage, refreshed in the background. After the
   first visit, typing is instant — and it keeps working if the line drops. */
var CAT=null, CIX=null, CATLOADING=false;
var C={CODE:0,NAME:1,CAT:2,SUB:3,BRAND:4,QTY:5,W:6,WO:7,GST:8,MV:9,COVER:10,SOLD:11,COMING:12,DUE:13};

function catKey(){ return 'vtf_cat_'+(CFG.token||'').slice(-8); }
function loadCatalog(force){
  if(CATLOADING) return;
  if(!force){
    try{
      var raw=localStorage.getItem(catKey());
      if(raw){ var o=JSON.parse(raw);
        if(o&&o.rows&&o.rows.length){ CAT=o.rows; buildIndex(); setCatMeta(o.at,true); } }
    }catch(e){}
  }
  CATLOADING=true;
  var acc=[], page=0;
  function next(){
    api('catalog',{page:page},function(d){
      acc=acc.concat(d.rows||[]);
      if(page+1<d.pages){ page++; next(); return; }
      CAT=acc; buildIndex(); CATLOADING=false;
      if(d.stock){ STOCKMETA=d.stock; paintStockBtn(); }
      var stamp=new Date().toISOString();
      try{ localStorage.setItem(catKey(),JSON.stringify({at:stamp,v:d.version,rows:acc})); }
      catch(e){ /* over quota — memory only, still instant this session */ }
      setCatMeta(stamp,false);
      if(VIEW==='find') search();
      if(VIEW==='home') drawHome();
    },function(e){ CATLOADING=false; if(!CAT) toast(e,true); });
  }
  next();
}
function setCatMeta(at,cached){
  var el=$('catMeta'); if(!el) return;
  el.textContent=(CAT?CAT.length.toLocaleString('en-IN'):'0')+' products'+
    (cached?' · from this device':' · just refreshed');
}
/* the same normalisation the PO app uses: strip everything but letters and
   digits, so 25*32 and 25 32 and 25x32 all match */
/* Descriptions are mostly sizes, so punctuation is noise: 14*30/35*45 must
   match "14 30 45", "14303545" and "35*45" alike. Strip everything but
   letters and digits on both sides, then require every token as a substring
   in ANY order. Verified against 4 PEL 14*30/35*45 MM COUPLING AQA for
   "4 pel 35 mm", "45 mm", "14303545", "14 30 45 pel", "aqa coupling 4 pel". */
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]/g,''); }
function toks(q){ return String(q||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
function buildIndex(){
  CIX=CAT.map(function(r){
    return {r:r,c:norm(r[C.CODE]+' '+r[C.NAME]+' '+r[C.BRAND]+' '+r[C.CAT]+' '+r[C.SUB])};
  });
}
function localSearch(q,cat,brand,sub,stockOnly){
  if(!CIX) return null;
  var tk=toks(q);
  var out=[];
  for(var i=0;i<CIX.length;i++){
    var it=CIX[i], r=it.r;
    if(cat && r[C.CAT]!==cat) continue;
    if(brand && r[C.BRAND]!==brand) continue;
    if(sub && r[C.SUB]!==sub) continue;
    if(stockOnly && !(Number(r[C.QTY])>0)) continue;
    if(tk.length){
      var ok=true;
      for(var t=0;t<tk.length;t++){
        if(it.c.indexOf(tk[t])<0){ ok=false; break; }
      }
      if(!ok) continue;
      /* rank by where the tokens land — an earlier match is a better match */
      var sc=0;
      for(var u=0;u<tk.length;u++) sc += it.c.indexOf(tk[u]);
      sc += String(r[C.NAME]).length*0.02;
      out.push({r:r,s:sc});
    } else out.push({r:r,s:String(r[C.NAME]).length*0.02});
    if(!tk.length && out.length>400) break;
  }
  out.sort(function(a,b){
    var ah=Number(a.r[C.QTY])>0?0:1, bh=Number(b.r[C.QTY])>0?0:1;
    if(ah!==bh) return ah-bh;
    return a.s-b.s;
  });
  return {items:out.slice(0,60).map(function(x){return x.r}), total:out.length};
}

/* ══════════════════ FILTERS ══════════════════ */
var FBRAND='', FSUB='';
function fillFilters(){
  if(!CAT) return;
  var b={},s={};
  CAT.forEach(function(r){ if(r[C.BRAND])b[r[C.BRAND]]=1; if(r[C.SUB])s[r[C.SUB]]=1; });
  var bs=$('fbrand'), ss=$('fsub');
  if(bs&&bs.options.length<2){
    Object.keys(b).sort().forEach(function(x){
      var o=document.createElement('option');o.value=x;o.textContent=x;bs.appendChild(o)});
  }
  if(ss&&ss.options.length<2){
    Object.keys(s).sort().forEach(function(x){
      var o=document.createElement('option');o.value=x;o.textContent=x;ss.appendChild(o)});
  }
}


/* what customers have asked for — the case for a PO, in evidence */
function demandBlock(d){
  if(!d||!d.total) return '';
  var chips='';
  [['no_stock','asked, no stock'],['request','not stocked'],
   ['enquiry','enquiry'],['feedback','feedback']].forEach(function(p){
    if(d[p[0]]>0) chips+='<span class="dchip d-'+p[0]+'">'+d[p[0]]+' '+p[1]+'</span>';
  });
  var recent=(d.items||[]).slice(0,4).map(function(x){
    return '<div class="why">'+esc(x.at)+' · '+esc(x.type.replace('_',' '))+
      (x.qty?' · qty '+x.qty:'')+(x.customer?' · '+esc(x.customer):'')+
      (x.note?' · "'+esc(x.note)+'"':'')+'</div>';
  }).join('');
  return '<div class="stock" style="background:var(--stone-l);border:1px solid var(--line);'+
    'color:var(--ink)"><div style="font-size:11px;font-weight:750;letter-spacing:.5px;'+
    'text-transform:uppercase;color:var(--ink3)">Customers have asked '+d.total+
    ' time'+(d.total===1?'':'s')+
    (d.qty?' · '+qn(d.qty)+' units wanted':'')+
    (d.customer_count?' · '+d.customer_count+' customer'+(d.customer_count===1?'':'s'):'')+
    '</div><div style="margin-top:6px">'+chips+'</div>'+recent+'</div>';
}

/* what is coming, and WHY it was ordered — a customer-order quantity is
   spoken for the moment it lands, so the counter must not promise it twice */
function poBlock(po){
  if(!po) return '';
  if(po.is_new && !po.on_order){
    return '<div class="stock" style="background:#EDE8FA;border:1px solid #D6CBF2;color:#4A3585">'+
      '<b>Added through a PO request</b> — this product was created at the counter, '+
      'not from the catalogue.'+
      (po.last_received?'<div class="why">last received '+esc(po.last_received)+'</div>':'')+
      '</div>';
  }
  if(!po.on_order) return '';
  var lines=(po.lines||[]).map(function(l){
    var why=l.reason?('<b>'+esc(l.reason)+'</b>'):'';
    return '<div class="why">'+esc(l.lane||'')+' PO '+esc(l.po)+' · '+esc(l.status)+
      ' · '+qn(l.ordered-l.received)+' due'+(l.due?' '+esc(l.due):'')+
      (l.part&&l.received_on?' · '+qn(l.received)+' received '+esc(l.received_on):'')+
      (why?' · for '+why:'')+'</div>';
  }).join('');
  var spoken=(po.reasons&&po.reasons['Customer Order'])?po.reasons['Customer Order']:0;
  return '<div class="stock y">'+
    (po.is_new?'<span class="newtag">added in PO</span> ':'')+
    '<span class="big">'+qn(po.on_order)+'</span> on the way'+
    (po.last_received?'  ·  part received '+esc(po.last_received):'')+
    (po.next_due?'  ·  due '+esc(po.next_due):'')+
    (po.in_transit>0?'  ·  '+qn(po.in_transit)+' in transit':'')+
    (spoken>0?'<div style="font-weight:750;margin-top:5px;color:var(--red)">'+
      '\u26A0 '+qn(spoken)+' of these are for a customer order — already spoken for'+
      '</div>':'')+
    lines+'</div>';
}

/* ══════════════════ BROWSE ALL ══════════════════
   The whole catalogue, sorted and filtered. Runs entirely on the cached
   copy, so it is instant even at 7,000 rows. */
var BSORT='az', BPAGE=0, BSIZE=100;
function drawBrowse(){
  if(!CAT){ $('vBrowse').innerHTML='<div class="empty"><div class="spin"></div>'+
    'Loading catalogue…</div>'; setTimeout(drawBrowse,600); return; }
  var rows=CAT.slice();
  var c=$('bcat')?$('bcat').value:'', b=$('bbrand')?$('bbrand').value:'',
      s=$('bsub')?$('bsub').value:'', q=$('bq')?$('bq').value.trim():'',
      st=$('bstock')?$('bstock').checked:false;
  if(c)rows=rows.filter(function(r){return r[C.CAT]===c});
  if(b)rows=rows.filter(function(r){return r[C.BRAND]===b});
  if(s)rows=rows.filter(function(r){return r[C.SUB]===s});
  if(st)rows=rows.filter(function(r){return Number(r[C.QTY])>0});
  if(q){var t=norm(q);rows=rows.filter(function(r){
    return norm(r[C.CODE]+' '+r[C.NAME]).indexOf(t)>=0});}

  var SORTS={
    az:function(x,y){return String(x[C.NAME]).localeCompare(String(y[C.NAME]))},
    za:function(x,y){return String(y[C.NAME]).localeCompare(String(x[C.NAME]))},
    stock:function(x,y){return Number(y[C.QTY])-Number(x[C.QTY])},
    low:function(x,y){return Number(x[C.QTY])-Number(y[C.QTY])},
    sold:function(x,y){return Number(y[C.SOLD])-Number(x[C.SOLD])},
    cover:function(x,y){return (Number(x[C.COVER])||99999)-(Number(y[C.COVER])||99999)},
    price:function(x,y){return Number(y[C.W])-Number(x[C.W])},
    cheap:function(x,y){return Number(x[C.W])-Number(y[C.W])},
    coming:function(x,y){return Number(y[C.COMING])-Number(x[C.COMING])}
  };
  rows.sort(SORTS[BSORT]||SORTS.az);
  var total=rows.length;
  var page=rows.slice(BPAGE*BSIZE,BPAGE*BSIZE+BSIZE);

  var h='<div class="sortbar">'+
    '<input type="text" id="bq" placeholder="filter…" value="'+esc(q)+'" style="flex:1;min-width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:8px">'+
    '<select id="bsort">'+
      opt('az','Name A–Z')+opt('za','Name Z–A')+opt('stock','Most stock')+
      opt('low','Least stock')+opt('sold','Best selling')+opt('cover','Least cover')+
      opt('price','Price high')+opt('cheap','Price low')+opt('coming','Most on order')+
    '</select>'+
    '<select id="bcat"><option value="">All categories</option></select>'+
    '<select id="bsub"><option value="">All subcategories</option></select>'+
    '<select id="bbrand"><option value="">All brands</option></select>'+
    '<label class="tog"><input type="checkbox" id="bstock"'+(st?' checked':'')+'> In stock</label>'+
    '<span class="muted" style="margin-left:auto;font-size:12px">'+total.toLocaleString('en-IN')+' products</span>'+
    '</div><div class="res">';
  page.forEach(function(r){
    var has=Number(r[C.QTY])>0;
    h+='<div class="p" data-c="'+esc(r[C.CODE])+'">'+
      '<span class="dot '+(has?'y':'n')+'"></span>'+
      '<div class="mid"><div class="nm">'+esc(r[C.NAME])+'</div>'+
      '<div class="cd">'+esc(r[C.CODE])+(r[C.BRAND]?'  ·  '+esc(r[C.BRAND]):'')+
        (r[C.SUB]?'  ·  '+esc(r[C.SUB]):'')+'</div>'+
      '<div class="pricebox">'+priceTags(r[C.W],r[C.WO],r[C.GST])+'</div></div>'+
      '<div class="rt"><div class="st '+(has?'y':'n')+'">'+
        (has?qn(r[C.QTY]):'no stock')+'</div>'+
      (Number(r[C.COMING])>0?'<div class="st y" style="font-size:11px">'+
        qn(r[C.COMING])+' coming</div>':'')+'</div></div>';
  });
  if(total>BSIZE){
    h+='<div class="srow" style="justify-content:center;padding:14px 0">'+
      '<button class="act" id="bPrev"'+(BPAGE?'':' disabled')+'>‹ prev</button>'+
      '<span class="muted">'+(BPAGE*BSIZE+1)+'–'+Math.min((BPAGE+1)*BSIZE,total)+'</span>'+
      '<button class="act" id="bNext"'+((BPAGE+1)*BSIZE>=total?' disabled':'')+'>next ›</button></div>';
  }
  h+='</div>';
  $('vBrowse').innerHTML=h;
  fillSel('bcat',C.CAT,c); fillSel('bsub',C.SUB,s); fillSel('bbrand',C.BRAND,b);
  $('bsort').value=BSORT;
  $('bsort').onchange=function(){BSORT=this.value;BPAGE=0;drawBrowse()};
  ['bcat','bsub','bbrand','bstock'].forEach(function(id){
    if($(id))$(id).onchange=function(){BPAGE=0;drawBrowse()}});
  var bq=$('bq'); if(bq){ bq.oninput=function(){var v=this.value;BPAGE=0;drawBrowse();
    var n=$('bq'); if(n){n.value=v;n.focus();n.setSelectionRange(v.length,v.length)}}; }
  if($('bPrev'))$('bPrev').onclick=function(){if(BPAGE){BPAGE--;drawBrowse()}};
  if($('bNext'))$('bNext').onclick=function(){BPAGE++;drawBrowse()};
  each($('vBrowse').querySelectorAll('.p[data-c]'),function(el){
    el.onclick=function(){openP(this.getAttribute('data-c'))}});
}
function opt(v,l){return '<option value="'+v+'">'+l+'</option>'}
function fillSel(id,ix,cur){
  var el=$(id); if(!el||!CAT)return;
  var seen={};
  CAT.forEach(function(r){ if(r[ix])seen[r[ix]]=1 });
  Object.keys(seen).sort().forEach(function(x){
    var o=document.createElement('option');o.value=x;o.textContent=x;
    if(x===cur)o.selected=true; el.appendChild(o)});
}

/* ══════════════════ QUOTE ══════════════════
   What this customer paid last time, beside what it sells for now. Both are
   shown because an old rate can quietly be below today's cost, and the
   counter should see that before repeating it. */
var QCUST=null, QLIST=[], QLANE='W', QEDIT={}, QCUSTS=null;
/* which rate each line is quoting from, any extra discount, and one set of
   additional charges for the whole quote */
var QSRC={}, QDISC={}, QCHARGE={label:'',amount:0};
/* VT-020c — the quote data never changes during a session and nothing here
   writes to a sheet, so it is cached on the device. First open pays for it;
   after that the customer list and every history is instant. A background
   refresh keeps it current without anyone waiting. */
function qKey(n){ return 'vtq_'+n+'_'+(CFG.token||'').slice(-8); }
function qCacheGet(n,maxAgeMin){
  try{
    var raw=localStorage.getItem(qKey(n)); if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o||!o.at) return null;
    if(maxAgeMin && (Date.now()-o.at)/60000 > maxAgeMin) return o.d;  /* stale but usable */
    return o.d;
  }catch(e){ return null; }
}
function qCacheSet(n,d){
  try{ localStorage.setItem(qKey(n),JSON.stringify({at:Date.now(),d:d})); }catch(e){}
}

function drawQuote(){
  if(!QCUSTS){
    var cached=qCacheGet('custs');
    if(cached && cached.length){
      QCUSTS=cached;
      /* refresh quietly behind the screen already on show */
      api('customers',{},function(d){
        if(d.items&&d.items.length){ QCUSTS=d.items; qCacheSet('custs',d.items);
          if(VIEW==='quote'&&!QCUST) drawQuote(); }
      },function(){});
    } else {
      $('vQuote').innerHTML='<div class="empty"><div class="spin"></div>Loading customers…</div>';
      api('customers',{},function(d){QCUSTS=d.items||[];qCacheSet('custs',QCUSTS);drawQuote()},
        function(e){$('vQuote').innerHTML='<div class="empty">'+esc(e)+'</div>'});
      return;
    }
  }
  var h='<div class="qbar">'+
    '<input type="text" id="qcust" placeholder="Customer…" value="'+
      esc(QCUST?QCUST.name:'')+'" style="flex:1;min-width:160px" autocomplete="off">'+
    '<div class="seg" style="display:flex;gap:3px">'+
      '<button class="act'+(QLANE==='W'?' pri':'')+'" id="qlw" style="padding:8px 14px"'+
        ((QCUST&&!QCUST.w)?' disabled title="no GST ledger for this customer"':'')+
        '>With GST</button>'+
      '<button class="act'+(QLANE==='WO'?' pri':'')+'" id="qlwo" style="padding:8px 14px"'+
        ((QCUST&&!QCUST.wo)?' disabled title="no non-GST ledger for this customer"':'')+
        '>Without GST</button>'+
    '</div>'+
    (QLIST.length?'<button class="act" id="qclear" style="padding:8px 12px">Clear</button>':'')+
    '</div><div id="qsug"></div>';

  if(!QCUST){
    h+='<div class="res"><div class="sec">Recent customers</div>';
    QCUSTS.slice(0,40).forEach(function(c){ h+=custRow(c); });
    h+='</div>';
    $('vQuote').innerHTML=h;
    wireQuoteBar();
    each($('vQuote').querySelectorAll('.p[data-ck]'),function(el){
      el.onclick=function(){ pickFirm(this.getAttribute('data-ck')); }});
    return;
  }

  h+='<div class="qbar" style="border-top:none">'+
    '<input type="text" id="qadd" placeholder="Add a product…" style="flex:1;min-width:160px" autocomplete="off">'+
    '<span class="muted" style="font-size:12px">'+QLIST.length+' line'+(QLIST.length===1?'':'s')+'</span>'+
    '</div><div id="qaddsug"></div>';

  h+='<div id="qhist"></div>';

  if(QLIST.length){
    var tot=0, totTax=0;
    h+='<div class="sec" style="padding:10px 14px 4px">Quote for '+esc(QCUST.name)+
      '  <span class="lanetag '+(QLANE==='W'?'w">WITH GST':'wo">WITHOUT GST')+'</span></div>';
    QLIST.forEach(function(l,i){
      var was=QLANE==='W'?l.last_w:l.last_wo;
      var wasDate=QLANE==='W'?l.last_w_date:l.last_wo_date;
      var now=QLANE==='W'?l.now_w:l.now_wo;
      var src=QSRC[l.code]||(was?'theirs':'list');
      var base=(src==='theirs'&&was)?was:(now||was||0);
      var rate=(QEDIT[l.code]!==undefined)?QEDIT[l.code]:base;
      var disc=Number(QDISC[l.code]||0);
      var net=Number(rate)*(1-disc/100);
      var line=net*Number(l.qty||1);
      tot+=line;
      var gst=Number(l.gst)||0;
      if(QLANE==='W'&&gst) totTax += line - (line/(1+gst/100));

      var delta='';
      if(was&&now){
        var d=Math.round((now-was)/was*1000)/10;
        delta=(d>0?'<span class="qup">list +'+d+'%</span>':
               (d<0?'<span class="qdn">list '+d+'%</span>':''));
      }
      h+='<div class="qrow">'+
        '<div class="qn"><b>'+esc(l.name)+'</b>'+
          '<span>'+esc(l.code)+
          (l.qty_available>0?'  ·  '+qn(l.qty_available)+' in stock':
            '  ·  <span style="color:var(--red)">no stock</span>')+
          (l.times?'  ·  bought '+l.times+'\u00d7, last '+esc(l.last):'  ·  first time')+
          '</span></div>'+

        '<div class="qcell was'+(src==='theirs'?' pick':'')+'" data-src="theirs" data-c="'+esc(l.code)+'">'+
          '<div class="l">their rate</div>'+
          '<div class="v">'+(was?rs(was):'\u2014')+'</div>'+
          (wasDate?'<div style="font-size:9.5px;color:var(--ink3)">'+esc(wasDate)+'</div>':'')+'</div>'+

        '<div class="qcell now'+(src==='list'?' pick':'')+'" data-src="list" data-c="'+esc(l.code)+'">'+
          '<div class="l">vasy rate</div>'+
          '<div class="v">'+(now?rs(now):'\u2014')+'</div>'+delta+'</div>'+

        '<div class="qcell"><div class="l">qty</div>'+
          '<input class="qin" data-q="'+i+'" value="'+(l.qty||1)+'"></div>'+
        '<div class="qcell"><div class="l">rate</div>'+
          '<input class="qin'+(QEDIT[l.code]!==undefined?' edited':'')+'" data-r="'+
            esc(l.code)+'" value="'+(Math.round(rate*100)/100)+'"></div>'+
        '<div class="qcell"><div class="l">disc %</div>'+
          '<input class="qin'+(disc?' edited':'')+'" data-d="'+esc(l.code)+
            '" value="'+disc+'"></div>'+
        '<div class="qcell"><div class="l">amount</div><div class="v">'+rs(line)+'</div>'+
          (QLANE==='W'&&gst?'<div style="font-size:9.5px;color:var(--ink3)">'+
            'ex '+rs(line/(1+gst/100))+'</div>':'')+'</div>'+
        '<button class="act" data-x="'+i+'" style="padding:6px 10px">\u2715</button>'+
        '</div>';
    });

    /* additional charges — freight, packing, anything else on the bill */
    h+='<div class="qrow" style="background:var(--stone-l)">'+
      '<div class="qn"><b>Additional charges</b>'+
        '<span>freight, packing, or anything else</span></div>'+
      '<div class="qcell"><div class="l">label</div>'+
        '<input class="qin" id="qchl" style="width:120px;text-align:left" value="'+
        esc(QCHARGE.label||'')+'" placeholder="freight"></div>'+
      '<div class="qcell"><div class="l">amount</div>'+
        '<input class="qin" id="qcha" value="'+(QCHARGE.amount||0)+'"></div>'+
      '</div>';
    var charge=Number(QCHARGE.amount)||0;
    var grand=tot+charge;

    h+='<div class="qtot">'+
      '<span>'+QLIST.length+' item'+(QLIST.length===1?'':'s')+'</span>'+
      '<span style="opacity:.75">goods '+rs(tot)+
        (charge?'  +  '+esc(QCHARGE.label||'charges')+' '+rs(charge):'')+
        (QLANE==='W'&&totTax?'  ·  incl GST '+rs(totTax):'')+'</span>'+
      '<div class="spacer" style="flex:1"></div>'+
      '<b>'+rs(grand)+'</b>'+
      '<button class="act" id="qcopy" style="padding:10px 16px">Copy</button>'+
      '<button class="act pri" id="qwa" style="padding:10px 16px">WhatsApp</button></div>';
  }
  $('vQuote').innerHTML=h;
  wireQuoteBar();
  wireQuoteRows();
  if(QPAIR) renderHistory();
}


/* ── one firm, two ledgers ──
   Vasy holds a customer twice: "AADHI PUMPS" and ". AADHI PUMPS", the dot
   marking the non-GST ledger. Same firm, so search finds them once — but the
   ledgers stay apart, because a quote is either GST or it is not, and the
   rates differ. The toggle switches ledger; each builds its own quote. */
function custRow(c){
  var tags='';
  if(c.w) tags+='<span class="lanetag w">W</span> ';
  if(c.wo) tags+='<span class="lanetag wo">WO</span> ';
  return '<div class="p" data-ck="'+esc(c.firm)+'">'+
    '<div class="mid"><div class="nm">'+esc(c.name)+'</div>'+
    '<div class="cd">'+tags+c.products+' products  ·  last '+esc(c.last)+
      (c.whatsapp?'  ·  '+esc(c.whatsapp):'')+'</div></div></div>';
}
function pickFirm(firm){
  QCUSTS.forEach(function(c){ if(c.firm===firm) QCUST=c; });
  if(!QCUST) return;
  QLIST=[];QEDIT={};QSRC={};QDISC={};QCHARGE={label:'',amount:0};
  /* open on whichever ledger they actually use */
  QLANE = QCUST.w ? 'W' : 'WO';
  QHIST=null; QHIST2=null;
  drawQuote();
  loadHistory();
}

function wireQuoteBar(){
  if($('qlw'))$('qlw').onclick=function(){
    if(QCUST&&!QCUST.w)return; QLANE='W';
    if(QHIST2)QHIST=QHIST2.w; drawQuote();};
  if($('qlwo'))$('qlwo').onclick=function(){
    if(QCUST&&!QCUST.wo)return; QLANE='WO';
    if(QHIST2)QHIST=QHIST2.wo; drawQuote();};
  if($('qclear'))$('qclear').onclick=function(){QLIST=[];QEDIT={};QSRC={};QDISC={};
    QCHARGE={label:'',amount:0};drawQuote()};
  var ci=$('qcust');
  if(ci)ci.oninput=function(){
    var t=this.value.toLowerCase().trim();
    if(!t){QCUST=null;QHIST=null;drawQuote();return}
    var hits=QCUSTS.filter(function(c){return c.name.toLowerCase().indexOf(t)>=0}).slice(0,12);
    $('qsug').innerHTML=hits.map(custRow).join('');
    each($('qsug').querySelectorAll('[data-ck]'),function(el){
      el.onclick=function(){ $('qsug').innerHTML=''; pickFirm(this.getAttribute('data-ck')); }});
  };
  var ai=$('qadd');
  if(ai)ai.oninput=function(){
    var v=this.value;
    var res=localSearch(v,'','','',false);
    if(!res||!v.trim()){$('qaddsug').innerHTML='';return}
    $('qaddsug').innerHTML=res.items.slice(0,8).map(function(r){
      return '<div class="p" data-add="'+esc(r[C.CODE])+'"><div class="mid">'+
        '<div class="nm">'+esc(r[C.NAME])+'</div><div class="cd">'+esc(r[C.CODE])+'</div></div>'+
        '<div class="rt"><div class="pr">'+rs(QLANE==='W'?r[C.W]:r[C.WO])+'</div></div></div>'}).join('');
    each($('qaddsug').querySelectorAll('[data-add]'),function(el){
      el.onclick=function(){addQuote(this.getAttribute('data-add'))}});
  };
}
function wireQuoteRows(){
  each($('vQuote').querySelectorAll('[data-q]'),function(el){
    el.onchange=function(){QLIST[Number(this.getAttribute('data-q'))].qty=
      Math.max(1,Number(this.value)||1);drawQuote()}});
  each($('vQuote').querySelectorAll('[data-r]'),function(el){
    el.onchange=function(){QEDIT[this.getAttribute('data-r')]=Number(this.value)||0;drawQuote()}});
  each($('vQuote').querySelectorAll('[data-x]'),function(el){
    el.onclick=function(){QLIST.splice(Number(this.getAttribute('data-x')),1);drawQuote()}});
  each($('vQuote').querySelectorAll('[data-d]'),function(el){
    el.onchange=function(){
      QDISC[this.getAttribute('data-d')]=Math.max(0,Math.min(100,Number(this.value)||0));
      drawQuote();}});
  /* tap either rate cell to quote from it */
  each($('vQuote').querySelectorAll('[data-src]'),function(el){
    el.style.cursor='pointer';
    el.onclick=function(){
      QSRC[this.getAttribute('data-c')]=this.getAttribute('data-src');
      delete QEDIT[this.getAttribute('data-c')];
      drawQuote();}});
  if($('qchl'))$('qchl').onchange=function(){QCHARGE.label=this.value;drawQuote()};
  if($('qcha'))$('qcha').onchange=function(){QCHARGE.amount=Number(this.value)||0;drawQuote()};
  if($('qcopy'))$('qcopy').onclick=function(){copyQuote(false)};
  if($('qwa'))$('qwa').onclick=function(){copyQuote(true)};
}
function addQuote(code){
  if(!QCUST)return;
  for(var i=0;i<QLIST.length;i++)if(QLIST[i].code===code){QLIST[i].qty=(QLIST[i].qty||1)+1;drawQuote();return}
  /* build the line locally — the catalogue and the history are both already
     on the device, so adding a product needs no round trip at all */
  var hist=null;
  if(QPAIR&&QPAIR.items){
    for(var j=0;j<QPAIR.items.length;j++) if(QPAIR.items[j].code===code) hist=QPAIR.items[j];
  }
  var cat=null;
  if(CAT){ for(var k=0;k<CAT.length;k++) if(CAT[k][C.CODE]===code) cat=CAT[k]; }
  if(cat||hist){
    QLIST.push({
      code:code, name:cat?cat[C.NAME]:(hist?hist.name:code), qty:1,
      qty_available:cat?Number(cat[C.QTY])||0:0,
      gst:cat?Number(cat[C.GST])||0:0,
      now_w:cat?Number(cat[C.W])||'':'', now_wo:cat?Number(cat[C.WO])||'':'',
      last_w:hist?hist.w:'', last_w_date:hist?hist.w_date:'',
      last_wo:hist?hist.wo:'', last_wo_date:hist?hist.wo_date:'',
      times:hist?(hist.w_times||hist.wo_times||0):0, last:hist?hist.last:''
    });
    $('qadd').value='';$('qaddsug').innerHTML='';drawQuote();
    return;
  }
  var lk=(QLANE==='WO'&&QCUST.wo)?QCUST.wo.key:(QCUST.w?QCUST.w.key:'');
  api('quote',{key:lk,codes:code},function(d){
    if(d.lines&&d.lines[0]){var l=d.lines[0];l.qty=1;QLIST.push(l);
      $('qadd').value='';$('qaddsug').innerHTML='';drawQuote();}
  },function(e){toast(e,true)});
}
var QHIST=null, QHIST2=null, QPAIR=null;
function loadHistory(){
  if(!QCUST)return;
  var ck='hist_'+QCUST.firm;
  var cached=qCacheGet(ck);
  if(cached){ QPAIR=cached; renderHistory(); }
  api('historypair',{w:QCUST.w?QCUST.w.key:'',wo:QCUST.wo?QCUST.wo.key:''},
    function(d){
      QPAIR=d; qCacheSet(ck,d);
      if(QCUST&&QCUST.firm===ck.slice(5)) renderHistory();
    }, function(){});
}
/* VT-020: one row per product with BOTH rates, and a button to add either.
   The same product is often bought on both ledgers at different rates —
   seeing the pair beats holding two lists in your head. */
function renderHistory(){
  var el=$('qhist'); if(!el||!QPAIR)return;
  var items=QPAIR.items||[];
  if(!items.length){el.innerHTML='<div class="empty">No purchase history for this customer.</div>';return}
  var h='<div class="sec" style="padding:10px 14px 4px">'+
    'What '+esc(QPAIR.customer)+' has bought  ('+QPAIR.total+
    (QPAIR.both?'  ·  '+QPAIR.both+' on both lanes':'')+')</div>'+
    '<div class="res">';
  items.slice(0,60).forEach(function(x){
    h+='<div class="p" style="align-items:stretch">'+
      '<div class="mid"><div class="nm">'+esc(x.name)+'</div>'+
      '<div class="cd">'+esc(x.code)+'  ·  '+qn(x.qty)+' units  ·  last '+esc(x.last)+'</div></div>'+
      '<div style="display:flex;gap:6px;align-items:center">'+

      (x.w?'<button class="act histbtn" data-add="'+esc(x.code)+'" data-lane="W" '+
        'style="padding:7px 11px;text-align:right">'+
        '<span class="lanetag w">W</span><br><b>'+rs(x.w)+'</b>'+
        (x.w_date?'<br><span style="font-size:9.5px;opacity:.6">'+esc(x.w_date)+'</span>':'')+
        '</button>':'<span class="qcell" style="opacity:.3;min-width:70px">'+
        '<div class="l">W</div><div class="v">—</div></span>')+

      (x.wo?'<button class="act histbtn" data-add="'+esc(x.code)+'" data-lane="WO" '+
        'style="padding:7px 11px;text-align:right">'+
        '<span class="lanetag wo">WO</span><br><b>'+rs(x.wo)+'</b>'+
        (x.wo_date?'<br><span style="font-size:9.5px;opacity:.6">'+esc(x.wo_date)+'</span>':'')+
        '</button>':'<span class="qcell" style="opacity:.3;min-width:70px">'+
        '<div class="l">WO</div><div class="v">—</div></span>')+

      '</div></div>';
  });
  if(items.length>60)h+='<div class="empty">Showing 60 of '+items.length+
    ' — use the search box above.</div>';
  h+='</div>';
  el.innerHTML=h;
  /* adding from a lane button switches the quote to that lane */
  each(el.querySelectorAll('.histbtn'),function(b){
    b.onclick=function(){
      var lane=this.getAttribute('data-lane');
      if(lane!==QLANE){
        if(lane==='W'&&!QCUST.w)return;
        if(lane==='WO'&&!QCUST.wo)return;
        QLANE=lane;
      }
      addQuote(this.getAttribute('data-add'));
    }});
}
function copyQuote(wa){
  if(!QLIST.length)return;
  var L=[], tot=0, gstTot=0;
  L.push('VITHYA TRADERS');
  L.push(QCUST.name);
  L.push(QLANE==='W'?'Rates include GST':'Rates without GST');
  L.push('');
  QLIST.forEach(function(l,i){
    var was=QLANE==='W'?l.last_w:l.last_wo, now=QLANE==='W'?l.now_w:l.now_wo;
    var src=QSRC[l.code]||(was?'theirs':'list');
    var base=(src==='theirs'&&was)?was:(now||was||0);
    var rate=(QEDIT[l.code]!==undefined)?QEDIT[l.code]:base;
    var disc=Number(QDISC[l.code]||0);
    var net=Number(rate)*(1-disc/100);
    var amt=net*Number(l.qty||1);
    tot+=amt;
    var g=Number(l.gst)||0;
    if(QLANE==='W'&&g) gstTot += amt-(amt/(1+g/100));
    L.push((i+1)+'. '+l.name);
    L.push('   '+l.qty+' x '+net.toFixed(2)+
      (disc?'  (after '+disc+'% off '+Number(rate).toFixed(2)+')':'')+
      '  =  '+amt.toFixed(2));
  });
  var charge=Number(QCHARGE.amount)||0;
  if(charge){ L.push(''); L.push((QCHARGE.label||'Additional charges')+': '+charge.toFixed(2)); }
  L.push('');
  L.push('TOTAL: '+(tot+charge).toFixed(2));
  if(QLANE==='W'&&gstTot){
    L.push('   (taxable '+((tot+charge)-gstTot).toFixed(2)+
      '  +  GST '+gstTot.toFixed(2)+')');
  }
  var txt=L.join('\n');
  if(wa){
    var no=String((QCUST&&QCUST.whatsapp)||'').replace(/[^0-9]/g,'');
    if(no && no.length===10) no='91'+no;
    window.open('https://wa.me/'+(no||'')+'?text='+encodeURIComponent(txt),'_blank');
    return;
  }
  var ta=document.createElement('textarea');
  ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Quote copied'); }
  catch(e){ toast('Could not copy — select the text manually',true); }
  document.body.removeChild(ta);
}



/* ══════════════════ HOME ══════════════════
   The counter is a busy place and not everyone here reads English easily.
   Six equal tabs make someone stop and choose; one big search box and a few
   large tiles do not. Everything is one tap from here, labelled in plain
   words, with the count on it so nobody has to go looking. */
function drawHome(){
  var a=ALERTS?ALERTS.counts:null;
  var urgent=a?((a.stockout||0)+(a.low||0)):0;
  var hour=new Date().getHours();
  var greet=hour<12?'Good morning':(hour<17?'Good afternoon':'Good evening');
  var who=(CFG.who||'').trim();

  var h='<div class="hero"><div class="hi">'+greet+(who?', '+esc(who.split(' ')[0]):'')+
    '</div><div class="sub">What do you need?</div></div>'+

    '<div class="bigsearch"><span class="mag">&#128269;</span>'+
    '<input type="text" id="hq" placeholder="Type a product name or code" autocomplete="off"></div>'+

    '<div class="tiles">'+
    tile('all','&#128230;','All items','Look through everything',
      CAT?CAT.length.toLocaleString('en-IN')+' products':'loading')+
    tile('todo','&#9888;&#65039;','To do','Things needing attention',
      urgent?urgent+' now':'nothing urgent', urgent>0)+
    tile('price','&#128179;','Price list','A customer&rsquo;s own rates','')+
    tile('count','&#128203;','Counting','Check stock on the shelf',
      CNT&&CNT.items?CNT.items.length+' to do':'')+
    tile('note','&#128172;','Tell the office','Somebody asked for something','')+
    tile('po','&#128221;','Order request','Ask for a product to be bought','')+
    '</div>';

  if(CAT){
    var inStock=0,out=0,coming=0;
    CAT.forEach(function(r){
      if(Number(r[C.QTY])>0)inStock++; else out++;
      if(Number(r[C.COMING])>0)coming++;
    });
    h+='<div class="hstat">'+
      '<div><div class="n">'+inStock.toLocaleString('en-IN')+'</div><div class="l">on the shelf</div></div>'+
      '<div><div class="n">'+out.toLocaleString('en-IN')+'</div><div class="l">out of stock</div></div>'+
      '<div><div class="n">'+coming.toLocaleString('en-IN')+'</div><div class="l">on the way</div></div>'+
      '</div>'+
      (STOCKMETA&&STOCKMETA.at?
        '<div style="text-align:center;font-size:11.5px;color:var(--ink3);'+
        'margin:-8px 0 16px">stock as at '+stockAge()+
        '  ·  <button class="act" id="hRefresh" style="padding:3px 10px;'+
        'font-size:11px">refresh now</button></div>':'');
  }
  $('vHome').innerHTML=h;

  var hq=$('hq');
  hq.oninput=function(){
    var v=this.value;
    if(!v.trim())return;
    goTab('find');
    var q=$('q'); if(q){ q.value=v; search(); q.focus(); }
  };
  hq.onkeydown=function(e){ if(e.key==='Enter'){ this.oninput(); } };

  if($('hRefresh'))$('hRefresh').onclick=refreshStock;
  each($('vHome').querySelectorAll('[data-go]'),function(el){
    el.onclick=function(){
      var g=this.getAttribute('data-go');
      if(g==='all')      goTab('browse');
      else if(g==='todo')  goTab('alert');
      else if(g==='price') goTab('quote');
      else if(g==='count') goTab('count');
      else if(g==='note')  { goTab('find'); askFree(); }
      else if(g==='po')    $('poTop').onclick();
    };
  });
}
function tile(k,ic,title,sub,cnt,urgent){
  return '<div class="tile'+(urgent?' urgent':'')+'" data-go="'+k+'">'+
    '<div class="ic">'+ic+'</div><div class="tl">'+title+'</div>'+
    '<div class="ts">'+sub+'</div>'+
    (cnt?'<div class="cnt">'+esc(cnt)+'</div>':'')+'</div>';
}
/* move to a tab as if it had been tapped, so the bar stays in step */
function goTab(name){
  var t=document.querySelectorAll('.tab');
  for(var i=0;i<t.length;i++){
    if(t[i].getAttribute('data-v')===name){ t[i].click(); return; }
  }
}


/* ══════════════════ LIVE STOCK ══════════════════
   Stock is the only figure here that cannot be a day old. It refreshes hourly
   on its own; this button closes even that gap when somebody is standing at
   the counter and needs to be sure. */
var STOCKMETA=null;
function stockAge(){
  if(!STOCKMETA||!STOCKMETA.at) return '';
  var m=STOCKMETA.age_min;
  if(m===null||m===undefined) return esc(STOCKMETA.at);
  if(m<2) return 'just now';
  if(m<60) return m+' min ago';
  var hr=Math.round(m/60);
  return hr+(hr===1?' hour ago':' hours ago');
}
function paintStockBtn(){
  var b=$('stockBtn'); if(!b) return;
  var m=STOCKMETA?STOCKMETA.age_min:null;
  var stale=(m!==null&&m!==undefined&&m>90);
  b.innerHTML='&#8635; '+(STOCKMETA&&STOCKMETA.at?stockAge():'Stock');
  b.style.background=stale?'var(--red-bg)':'';
  b.style.color=stale?'var(--red)':'';
  b.title=stale?'Stock is more than an hour and a half old — tap to refresh'
                :'Stock as at '+(STOCKMETA?STOCKMETA.at:'—')+' — tap to refresh';
}
function refreshStock(){
  var b=$('stockBtn'); if(b){b.innerHTML='&#8635; …';b.disabled=true}
  toast('Refreshing stock from Vasy — about a minute');
  api('restock',{},function(d){
    if(b)b.disabled=false;
    if(d.error){ toast(d.error,true); paintStockBtn(); return; }
    STOCKMETA=d.meta||null;
    /* fold the new quantities into the copy already on the device */
    if(d.map&&CAT){
      var n=0;
      CAT.forEach(function(r){
        var s=d.map[r[C.CODE]];
        if(s){ r[C.QTY]=s.total; n++; }
      });
      try{ localStorage.setItem(catKey(),
        JSON.stringify({at:new Date().toISOString(),rows:CAT})); }catch(e){}
      toast('Stock updated — '+n.toLocaleString('en-IN')+' products');
    } else {
      toast('Stock refreshed');
    }
    paintStockBtn();
    if(VIEW==='find')search();
    if(VIEW==='home')drawHome();
    if(VIEW==='browse')drawBrowse();
    if(VIEW==='alert')loadAlerts();
  },function(e){ if(b)b.disabled=false; toast(e,true); paintStockBtn(); });
}
</script>
