<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vithya — Office</title>
<style>
:root{
  --brand:#CC3018; --brand-d:#A72410; --brand-l:#FBEDEA; --stone:#6C6C60; --stone-l:#F2F1EE;
  --w:#1D5FA8; --w-l:#E9F0F9; --wo:#CC3018; --wo-l:#FBEDEA;
  --ink:#1A1A17; --ink2:#4A4A42; --ink3:#8A8A7E; --line:#E2E0DA; --line2:#F0EFEB;
  --bg:#F6F5F2; --card:rgba(255,255,255,.82);
  --amber:#A8730F; --amber-bg:#FDF5E4; --red:#B3372C; --red-bg:#FBEEEC;
  --green:#2C6B4A; --green-bg:#E9F3ED;
  --glass:saturate(160%) blur(18px);
  --sh:0 1px 2px rgba(26,26,23,.05),0 8px 28px rgba(26,26,23,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 8% -8%, rgba(204,48,24,.10), transparent 60%),
    radial-gradient(900px 520px at 96% 4%, rgba(108,108,96,.12), transparent 60%),
    var(--bg);
  background-attachment:fixed}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}

.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);border-bottom:1px solid rgba(226,224,218,.85);flex:0 0 auto}
.logo{height:28px;display:block}
.bsub{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--stone);
  font-weight:700;border-left:1px solid var(--line);padding-left:11px}
.tabs{display:flex;gap:2px;margin-left:10px}
.tab{padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:600}
.tab:hover{background:var(--stone-l)}
.tab.on{background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(204,48,24,.26)}
.tab .pill{display:inline-block;min-width:18px;padding:0 6px;margin-left:7px;border-radius:9px;
  background:rgba(0,0,0,.12);font-size:10.5px;font-weight:700}
.tab.on .pill{background:rgba(255,255,255,.28)}
.spacer{flex:1}
.meta{color:var(--ink3);font-size:11.5px}
.ico{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  cursor:pointer;color:var(--ink2)}
.ico:hover{background:var(--stone-l)}

.view{flex:1;overflow:auto;padding:18px}
.view.grid{padding:0;display:flex;flex-direction:column}

/* ── summary cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;
  margin-bottom:20px}
.card{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid rgba(226,224,218,.9);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
.card .l{font-size:10.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink3)}
.card .v{font-size:23px;font-weight:750;letter-spacing:-.5px;margin-top:4px;
  font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.card.alert{border-color:#E8BDB7;background:rgba(251,238,236,.85)}
.card.alert .v{color:var(--red)}
.card.warn{border-color:#F0DCB8;background:rgba(253,245,228,.85)}
.card.warn .v{color:var(--amber)}
.card.good .v{color:var(--green)}

/* ── action feed ── */
.grp{margin-bottom:22px}
.grph{display:flex;align-items:baseline;gap:11px;margin-bottom:9px}
.grph h3{margin:0;font-size:14px;font-weight:750}
.grph .n{font-size:11.5px;color:var(--ink3)}
.grph .imp{margin-left:auto;font-size:12.5px;font-weight:700}
.item{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid rgba(226,224,218,.9);border-radius:11px;padding:11px 14px;margin-bottom:7px;
  display:flex;align-items:center;gap:13px;flex-wrap:wrap;cursor:pointer;box-shadow:var(--sh)}
.item:hover{border-color:var(--brand)}
.item.r1{border-left:3px solid var(--red)}
.item.r2{border-left:3px solid var(--amber)}
.item.r3{border-left:3px solid var(--w)}
.item.r4{border-left:3px solid var(--stone)}
.item.r5{border-left:3px solid var(--ink3)}
.item .cd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--brand-d);
  min-width:108px}
.item .nm{flex:1;min-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .act{font-weight:650;white-space:nowrap}
.item .imp{font-variant-numeric:tabular-nums;font-weight:700;min-width:96px;text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:10.5px;font-weight:700}
.t-a{background:var(--red-bg);color:var(--red)}
.t-b{background:var(--amber-bg);color:var(--amber)}
.t-c{background:var(--stone-l);color:var(--stone)}
.t-x{background:var(--green-bg);color:var(--green)}
.t-w{background:var(--w-l);color:var(--w)}
.t-wo{background:var(--wo-l);color:var(--wo)}

/* ── grid ── */
.bar{display:flex;gap:8px;align-items:center;padding:9px 18px;flex-wrap:wrap;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);border-bottom:1px solid rgba(226,224,218,.85);flex:0 0 auto}
.bar input[type=text]{padding:7px 11px;border:1.5px solid var(--line);border-radius:8px;
  min-width:230px;outline:none;background:rgba(255,255,255,.9)}
.bar input[type=text]:focus{border-color:var(--brand)}
.bar select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.9);max-width:170px}
.chip{padding:6px 11px;border:1px solid var(--line);border-radius:8px;
  background:rgba(255,255,255,.85);cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--brand);color:var(--brand-d)}
.gw{flex:1;overflow:auto}
table.g{border-collapse:separate;border-spacing:0;min-width:100%;
  font-variant-numeric:tabular-nums}
.g th{position:sticky;top:0;z-index:2;background:rgba(248,247,244,.95);
  border-bottom:1.5px solid var(--line);border-right:1px solid var(--line2);
  padding:7px 9px;text-align:left;font-size:10.5px;font-weight:700;color:var(--ink2);
  white-space:nowrap;cursor:pointer;text-transform:uppercase;letter-spacing:.4px}
.g th:hover{background:var(--brand-l)}
.g th.num,.g td.num{text-align:right}
.g td{padding:5px 9px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);
  white-space:nowrap;background:rgba(255,255,255,.62)}
.g tr:hover td{background:rgba(255,255,255,.96);cursor:pointer}
.g td.cd{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--brand-d)}
.g td.nm{max-width:270px;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--red);font-weight:700}
.foot{display:flex;align-items:center;gap:14px;padding:8px 18px;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);border-top:1px solid rgba(226,224,218,.85);flex:0 0 auto}
.stat{font-size:11.5px;color:var(--ink2)}
.stat b{color:var(--ink);font-weight:750}

/* ── panels ── */
.ov{position:fixed;inset:0;background:rgba(26,26,23,.36);display:none;z-index:60;
  align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
.ov.on{display:flex}
.panel{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(26,26,23,.24);
  width:100%;max-width:880px}
.panel.sm{max-width:460px}
.ph{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h3{margin:0;font-size:15.5px;font-weight:750}
.pb{padding:18px 20px}
.pf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.x{cursor:pointer;color:var(--ink3);font-size:22px;line-height:1;padding:0 6px}
.x:hover{color:var(--red)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--ink2);font-weight:650;margin-bottom:4px}
.fld input,.fld select{width:100%;padding:8px 11px;border:1.5px solid var(--line);
  border-radius:8px;outline:none}
.btn{padding:7px 15px;border-radius:8px;border:none;cursor:pointer;font-weight:650}
.btn.p{background:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand-d)}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink2)}
.btn.sm{padding:5px 10px;font-size:11.5px}

/* detail */
.kv{font-size:12.5px}
.kv .r{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid var(--line2)}
.kv .r:last-child{border-bottom:none}
.kv .k{color:var(--ink2)}
.kv .v{font-weight:650;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  font-weight:750;margin:0 0 8px}
.bars{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:6px}
.bars .b{flex:1;background:var(--w);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);
  font-size:9px;color:var(--ink3);white-space:nowrap}
.barwrap{padding-bottom:20px}

.empty{padding:56px 20px;text-align:center;color:var(--ink3)}
.spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:11px 20px;border-radius:10px;font-size:12.5px;z-index:99;display:none}
.toast.on{display:block}
.toast.err{background:var(--red)}

.bars2{display:flex;align-items:flex-end;gap:6px;height:130px;margin:14px 0 30px}
.bars2 .b{flex:1;background:var(--w);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars2 .b:hover{opacity:.8}
.bars2 .b span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--ink3);white-space:nowrap}
.gridbox{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;max-width:520px;margin:8px 0 18px}
.gcell{padding:11px 8px;border-radius:9px;text-align:center;cursor:pointer;
  background:var(--stone-l);border:1px solid var(--line)}
.gcell:hover{border-color:var(--brand)}
.gcell .n{font-size:17px;font-weight:750}
.gcell .v{font-size:10.5px;color:var(--ink3);margin-top:1px}
.gcell.hot{background:var(--red-bg);border-color:#E8BDB7}
.gcell.warm{background:var(--amber-bg);border-color:#F0DCB8}
.glabel{display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:750;color:var(--ink3)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.collect{background:var(--amber-bg);border:1px solid #F0DCB8;border-radius:12px;
  padding:14px 16px;margin-bottom:18px}
.cbar{height:9px;background:rgba(0,0,0,.08);border-radius:99px;overflow:hidden;margin:9px 0 6px}
.cbar>div{height:100%;background:var(--amber);border-radius:99px}

/* ── drill-down overlay ── */
.drill{position:fixed;inset:0;background:rgba(26,26,23,.4);display:none;z-index:70;
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.drill.on{display:flex}
.dpanel{background:#fff;border-radius:15px;width:100%;max-width:1120px;
  box-shadow:0 18px 50px rgba(26,26,23,.26)}
.dhead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;position:sticky;top:0;background:#fff;border-radius:15px 15px 0 0;z-index:2}
.dhead h3{margin:0;font-size:16px;font-weight:750;flex:1}
.dback{cursor:pointer;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  font-weight:650;background:#fff}
.dback:hover{background:var(--stone-l)}
.dbody{padding:0 0 20px}
.clik{cursor:pointer}
.clik:hover{background:var(--brand-l)!important}
/* ── verdict strip on the product card ── */
.vstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:4px 0 18px}
.vbox{border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:#fff}
.vbox .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:750;color:var(--ink3)}
.vbox .n{font-size:21px;font-weight:750;letter-spacing:-.4px;margin-top:2px;
  font-variant-numeric:tabular-nums}
.vbox .s{font-size:11px;margin-top:2px;font-weight:650}
.vbox.good{background:var(--green-bg);border-color:#BFD9C9}
.vbox.good .n,.vbox.good .s{color:var(--green)}
.vbox.bad{background:var(--red-bg);border-color:#E8BDB7}
.vbox.bad .n,.vbox.bad .s{color:var(--red)}
.vbox.warn{background:var(--amber-bg);border-color:#F0DCB8}
.vbox.warn .n,.vbox.warn .s{color:var(--amber)}
/* ── inline PO progress ── */
.prog{display:inline-flex;align-items:center;gap:2px;cursor:pointer;vertical-align:middle}
.prog i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.prog i.on{background:var(--w)} .prog i.done{background:var(--green)}
.prog i.late{background:var(--red)}
.progwrap{padding:8px 12px;background:var(--stone-l);border-radius:9px;margin:4px 0;
  font-size:11.5px;line-height:1.7}
.pbar{height:8px;border-radius:99px;background:rgba(0,0,0,.07);overflow:hidden;
  display:flex;margin:5px 0}
.pbar span{height:100%}
.pbar .rec{background:var(--green)} .pbar .shp{background:var(--w)}
.pbar .ord{background:var(--amber)}
.act-note{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:5px}

.pbar{display:flex;height:9px;border-radius:99px;overflow:hidden;
  background:rgba(0,0,0,.06);gap:1px}
.pbar.mini{width:70px;display:inline-flex;vertical-align:middle}
.pbar span{min-width:2px}
.prog{cursor:pointer;display:inline-block}
.progrow td{background:var(--stone-l)}
</style>
</head>
<body>
<div class="app" id="app" style="display:none">
  <div class="top">
    <img class="logo" id="logo" alt="Vithya Traders">
    <span class="bsub">Office</span>
    <div class="tabs">
      <div class="tab on" data-v="today">Today <span class="pill" id="nToday"></span></div>
      <div class="tab" data-v="grid">Products</div>
      <div class="tab" data-v="inv">Inventory</div>
      <div class="tab" data-v="sales">Sales</div>
      <div class="tab" data-v="po">Purchase</div>
      <div class="tab" data-v="gap">Cost gaps</div>
      <div class="tab" data-v="counts">Counts <span class="pill" id="nCount"></span></div>
    </div>
    <div class="spacer"></div>
    <span class="meta" id="meta"></span>
    <button class="ico" id="btnConn">&#9881;</button>
  </div>

  <div class="view" id="vToday"><div class="empty"><div class="spin"></div>Loading…</div></div>

  <div class="view grid" id="vGrid" style="display:none">
    <div class="bar">
      <input type="text" id="q" placeholder="Search code or name…">
      <select id="fcat"><option value="">All categories</option></select>
      <select id="fbrand"><option value="">All brands</option></select>
      <select id="fabc"><option value="">ABC</option><option>A</option><option>B</option><option>C</option></select>
      <select id="fxyz"><option value="">XYZ</option><option>X</option><option>Y</option><option>Z</option></select>
      <select id="fmov"><option value="">Movement</option><option>fast</option><option>slow</option>
        <option>excess</option><option>dead</option><option>reserve</option>
        <option>negative</option><option>nosale</option></select>
      <select id="fflag"><option value="">Flags</option><option value="ANY">Any flag</option>
        <option value="LOSS">Loss</option><option value="STOCKOUT">Stockout</option>
        <option value="REORDER">Reorder</option><option value="DEAD">Dead</option>
        <option value="EXCESS">Excess</option><option value="NEGATIVE">Negative</option></select>
      <button class="chip" id="btnClear">Clear</button>
    </div>
    <div class="gw" id="gw"></div>
    <div class="foot">
      <span class="stat" id="sTotal"></span>
      <span class="stat" id="sVal"></span>
      <span class="stat" id="sMarg"></span>
      <div class="spacer"></div>
      <button class="chip" id="pPrev">&lsaquo;</button>
      <span class="stat" id="pInfo"></span>
      <button class="chip" id="pNext">&rsaquo;</button>
    </div>
  </div>

  <div class="view" id="vInv" style="display:none"></div>
  <div class="view" id="vSales" style="display:none"></div>
  <div class="view" id="vPo" style="display:none"></div>
  <div class="view" id="vGap" style="display:none"></div>
  <div class="view" id="vCounts" style="display:none"></div>
</div>

<div class="ov on" id="ovConn">
  <div class="panel sm">
    <div class="ph"><h3>Connect</h3></div>
    <div class="pb">
      <div class="fld"><label>Web app URL (ends with /exec)</label>
        <input id="cUrl" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="fld"><label>Office token</label><input id="cTok" placeholder="VT_OFFICE_TOKEN"></div>
      <div class="meta" id="cMsg"></div>
    </div>
    <div class="pf"><button class="btn p" id="cSave">Connect</button>
      <button class="btn g" id="cClose" style="display:none">Cancel</button></div>
  </div>
</div>

<div class="ov" id="ovDet"><div class="panel"><div class="ph">
  <h3 id="dT"></h3><div class="spacer"></div><span class="x" id="dX">&times;</span></div>
  <div class="pb" id="dB"></div></div></div>

<div class="ov" id="ovAct"><div class="panel sm"><div class="ph">
  <h3 id="aT"></h3><div class="spacer"></div><span class="x" id="aX">&times;</span></div>
  <div class="pb" id="aB"></div></div></div>

<div class="drill" id="drill"><div class="dpanel">
  <div class="dhead"><button class="dback" id="dBack">‹ Back</button>
    <h3 id="dTitle"></h3><span class="x" id="dClose">&times;</span></div>
  <div class="dbody" id="dBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
var CFG={url:localStorage.getItem('vto_url')||'',token:localStorage.getItem('vto_tok')||''};
var SEQ=0;
function api(action,params,ok,fail){
  if(!CFG.url||!CFG.token){fail&&fail('Not connected');return;}
  var cb='vto'+(++SEQ)+'_'+Date.now(),done=false,s=document.createElement('script');
  var t=setTimeout(function(){if(done)return;done=true;clean();fail&&fail('Timed out');},45000);
  function clean(){try{delete window[cb]}catch(e){window[cb]=undefined}
    if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(t);}
  window[cb]=function(r){if(done)return;done=true;clean();
    if(r&&r.ok)ok&&ok(r.data);else fail&&fail(r&&r.error?r.error:'Unknown error');};
  var qs=['app=office','action='+encodeURIComponent(action),
    'token='+encodeURIComponent(CFG.token),'callback='+cb];
  for(var k in params){var v=params[k];
    if(v!==undefined&&v!==null&&v!=='')qs.push(k+'='+encodeURIComponent(v));}
  s.src=CFG.url+(CFG.url.indexOf('?')<0?'?':'&')+qs.join('&');
  s.onerror=function(){if(done)return;done=true;clean();fail&&fail('Could not reach the URL');};
  document.body.appendChild(s);
}

var FIELDS=[],IX={},ROWS=[],PAGE=0,SIZE=100,TOTAL=0,SORT='stock_value',DIR='desc',VIEW='today';
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,e){var t=$('toast');t.textContent=m;t.className='toast on'+(e?' err':'');
  setTimeout(function(){t.className='toast'},e?5000:2600)}
function rs(v){if(v===''||v===null||v===undefined||isNaN(v))return '—';
  return '\u20B9'+Math.round(Number(v)).toLocaleString('en-IN')}
function n2(v){if(v===''||v===null||v===undefined||isNaN(v))return '—';
  return Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pc(v){if(v===''||v===null||v===undefined||isNaN(v))return '—';
  return Number(v).toFixed(1)+'%'}
function pcm(v){if(v===''||v===null||v===undefined||isNaN(v))return '—';
  return (Number(v)*100).toFixed(1)+'%'}
function abcTag(a){var c=a==='A'?'t-a':(a==='B'?'t-b':'t-c');

function start(){
  api('init',{},function(d){
    FIELDS=d.fields;FIELDS.forEach(function(f,i){IX[f]=i});
    $('meta').textContent=Number(d.count).toLocaleString('en-IN')+' products';
    fill($('fcat'),d.categories);fill($('fbrand'),d.brands);
    $('ovConn').className='ov';$('app').style.display='flex';
    loadToday();loadCountBadge();
    /* fetch the full table in the background — by the time anyone opens
       Products or clicks a drill-down it is already here */
    loadAll(function(){});
  },function(e){$('cMsg').textContent=e;$('cClose').style.display='none';});
}
function fill(sel,arr){arr.forEach(function(v){var o=document.createElement('option');
  o.value=v;o.textContent=v;sel.appendChild(o);});}

var tabs=document.querySelectorAll('.tab');
for(var i=0;i<tabs.length;i++){
  tabs[i].onclick=function(){
    for(var j=0;j<tabs.length;j++)tabs[j].className='tab';
    this.className='tab on';
    VIEW=this.getAttribute('data-v');
    $('vToday').style.display=VIEW==='today'?'block':'none';
    $('vGrid').style.display=VIEW==='grid'?'flex':'none';
    $('vInv').style.display=VIEW==='inv'?'block':'none';
    $('vSales').style.display=VIEW==='sales'?'block':'none';
    $('vPo').style.display=VIEW==='po'?'block':'none';
    $('vGap').style.display=VIEW==='gap'?'block':'none';
    if(VIEW==='gap')loadGap();
    $('vCounts').style.display=VIEW==='counts'?'block':'none';
    if(VIEW==='grid'&&!ROWS.length)loadGrid();

}

/* ══════════ TODAY ══════════ */
function loadToday(){
  api('summary',{},function(s){
    api('actions',{limit:80},function(a){renderToday(s,a)},
      function(e){$('vToday').innerHTML='<div class="empty">'+esc(e)+'</div>'});
  },function(e){$('vToday').innerHTML='<div class="empty">'+esc(e)+'</div>'});
}

function renderToday(s,a){
  var vp=s.products?(s.verified/s.products*100):0;
  var h='<div class="cards">'+
    card('Stock value','',rs(s.positive_value),
      s.negative_count?(s.negative_count+' items negative, '+rs(Math.abs(s.negative_value))):'','stock')+
    card('Cost needs verifying',s.check_cost?'warn':'good',s.check_cost||0,
      'margin looks negative on a frozen cost','checkcost')+
    (s.loss?card('Selling below cost','alert',s.loss,'against a CURRENT cost','loss'):'')+
    card('Out of stock',s.stockout?'warn':'good',s.stockout,'still selling','stockout')+
    card('To reorder','',s.reorder,rs(s.reorder_value)+' to commit','reorder')+
    card('Dead stock',s.dead?'warn':'good',s.dead,rs(s.dead_value)+' locked','dead')+
    card('Verified',vp<20?'warn':'',pc(vp),s.verified+' of '+s.products+' counted')+
    '</div>';

  if(s.negative_count){
    h+='<div class="card alert" style="margin-bottom:20px">'+
      '<div class="l">Read this first</div>'+
      '<div style="font-size:12.5px;margin-top:6px;color:var(--ink2);line-height:1.6">'+
      '<b>'+s.negative_count+' products show negative stock</b> ('+rs(Math.abs(s.negative_value))+
      '). Sales were recorded against them; purchases were not. Until they are counted, '+
      'reorder points, cover and excess figures for those products are not meaningful. '+
      'The Counts tab is where that gets fixed.</div></div>';
  }

  var byRank={};
  a.items.forEach(function(x){(byRank[x.rank]=byRank[x.rank]||[]).push(x)});
  a.groups.forEach(function(g){
    var list=byRank[g.rank]||[];
    if(!list.length)return;
    h+='<div class="grp"><div class="grph"><h3>'+esc(g.group)+'</h3>'+
      '<span class="n">'+g.n+' item'+(g.n===1?'':'s')+
      (list.length<g.n?' · showing top '+list.length:'')+'</span>'+
      '<span class="imp">'+rs(g.impact)+'</span></div>';
    list.forEach(function(x){h+=actItem(x)});
    h+='</div>';
  });
  if(!a.items.length)h+='<div class="empty">Nothing needs action today.</div>';
  $('vToday').innerHTML=h;
  $('nToday').textContent=a.total;
  loadDigest();
  wireItems();
  wireCards($('vToday'));
  /* the group heading opens everything in that group, not just the top rows */
  each($('vToday').querySelectorAll('.grph'),function(el){
    el.className+=' clik'; el.style.cursor='pointer';
    el.onclick=function(){
      var t=this.querySelector('h3'); if(!t)return;
      var g=t.textContent;
      var f={'Cost needs verifying':'checkcost',
        'Selling below a current cost':'loss','Out of stock, still selling':'stockout',
        'Below reorder point':'reorder','Dead stock':'dead',
        'Margin below floor':null}[g];
      loadAll(function(){
        var rows = f&&CARD_FILTER[f] ? allWhere(CARD_FILTER[f][0])
          : allWhere(function(r){return String(r[IX.action]||'')!==''});
        drill(g, rows, '');
      });
    }});
}

/* card(label, class, value, sub, drillKey)
   The class comes second so the colour is decided beside the label rather
   than trailing after two other arguments. drillKey is optional — when set,
   the card becomes clickable and opens the products behind the number. */
function card(l,cls,v,s,k){
  return '<div class="card '+(cls||'')+(k?' clik':'')+'"'+
    (k?' data-card="'+k+'"':'')+'>'+
    '<div class="l">'+l+'</div>'+
    '<div class="v">'+v+'</div><div class="s">'+(s||'')+'</div></div>';
}

/* every headline number can open the rows behind it */
var CARD_FILTER={
  loss:     [function(r){return String(r[IX.flags]).indexOf('LOSS')>=0},'Selling below a current cost'],
  checkcost:[function(r){return String(r[IX.flags]).indexOf('CHECK COST')>=0},'Cost needs verifying'],
  stockout: [function(r){return String(r[IX.flags]).indexOf('STOCKOUT')>=0},'Out of stock, still selling'],
  reorder:  [function(r){return Number(r[IX.suggested_order])>0},'Below reorder point'],
  dead:     [function(r){return r[IX.movement]==='dead'},'Dead stock'],
  excess:   [function(r){return r[IX.movement]==='excess'},'Excess stock'],
  negative: [function(r){return Number(r[IX.qty_total])<0},'Negative stock'],
  stock:    [function(r){return Number(r[IX.stock_value])>0},'All stock']
};
function wireCards(scope){
  if(!scope)return;
  each(scope.querySelectorAll('[data-card]'),function(el){
    el.style.cursor='pointer';
    el.onclick=function(){
      var f=CARD_FILTER[this.getAttribute('data-card')];
      if(!f)return;
      loadAll(function(){ drill(f[1], allWhere(f[0]), ''); });
    };
  });
}
function actItem(x){
  return '<div class="item r'+x.rank+'" data-c="'+esc(x.code)+'">'+
    '<span class="cd">'+esc(x.code)+'</span>'+
    abcTag(x.abc)+xyzTag(x.xyz)+
    '<span class="nm">'+esc(x.name)+'</span>'+
    '<span class="act">'+esc(x.action)+'</span>'+
    '<span class="imp">'+rs(x.impact)+'</span></div>';
}
function wireItems(){
  var el=document.querySelectorAll('.item[data-c]');
  for(var i=0;i<el.length;i++)el[i].onclick=function(){openDetail(this.getAttribute('data-c'))};
}

var GCOLS=['item_code','product_name','category','abc_revenue','xyz','movement',
  'qty_total','stock_value','units_365d','days_cover','turns','gmroi',
  'margin_pct','suggested_order','flags'];
var GLAB={item_code:'Code',product_name:'Product',category:'Category',abc_revenue:'ABC',
  xyz:'XYZ',movement:'Movement',qty_total:'Qty',stock_value:'Stock ₹',units_365d:'Sold 12m',
  days_cover:'Cover d',turns:'Turns',gmroi:'GMROI',margin_pct:'Margin%',
  suggested_order:'Order',flags:'Flags'};
var GNUM={qty_total:1,stock_value:1,units_365d:1,days_cover:1,turns:1,gmroi:1,
  margin_pct:1,suggested_order:1};

function filters(){return {q:$('q').value.trim(),cat:$('fcat').value,brand:$('fbrand').value,
  abc:$('fabc').value,xyz:$('fxyz').value,movement:$('fmov').value,flag:$('fflag').value};}
var FT=null;
$('q').oninput=function(){
  if(ALL){PAGE=0;loadGrid();return}          /* local — no wait */
  if(FT)clearTimeout(FT);FT=setTimeout(function(){PAGE=0;loadGrid()},320);
};
['fcat','fbrand','fabc','fxyz','fmov','fflag'].forEach(function(id){
  $(id).onchange=function(){PAGE=0;loadGrid()}});
$('btnClear').onclick=function(){['q','fcat','fbrand','fabc','fxyz','fmov','fflag']
  .forEach(function(i){$(i).value=''});PAGE=0;loadGrid()};
$('pPrev').onclick=function(){if(PAGE>0){PAGE--;loadGrid()}};
$('pNext').onclick=function(){if((PAGE+1)*SIZE<TOTAL){PAGE++;loadGrid()}};

/* Filter, sort and page entirely in the browser.
   This used to call the server for every sort click, every filter change and
   every page — four round trips to look at one category. The rows are the
   same 7,000 each time, so they are fetched once and worked on locally. */
function loadGrid(){
  if(!ALL){
    $('gw').innerHTML='<div class="empty"><div class="spin"></div>'+
      'Loading the full table once — after this, sorting and filtering are instant.</div>';
    loadAll(function(){ loadGrid(); });
    return;
  }
  var p=filters();
  /* punctuation-blind, order-independent: "14 30 45 pel" and "35*45" both
     find 4 PEL 14*30/35*45 MM COUPLING AQA */
  var terms=String(p.q||'').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

  var f=ALL.filter(function(r){
    if(p.cat && r[IX.category]!==p.cat) return false;
    if(p.brand && r[IX.brand]!==p.brand) return false;
    if(p.abc && r[IX.abc_revenue]!==p.abc) return false;
    if(p.xyz && r[IX.xyz]!==p.xyz) return false;
    if(p.movement && r[IX.movement]!==p.movement) return false;
    if(p.flag){
      var fl=String(r[IX.flags]||'');
      if(p.flag==='ANY' ? !fl : fl.indexOf(p.flag)<0) return false;
    }
    if(terms.length){
      var hay=(String(r[IX.item_code])+String(r[IX.product_name])+
        String(r[IX.brand])+String(r[IX.category])+String(r[IX.sub_category]))
        .toLowerCase().replace(/[^a-z0-9]/g,'');
      for(var i=0;i<terms.length;i++) if(hay.indexOf(terms[i])<0) return false;
    }
    return true;
  });

  var i=IX[SORT], dir=(DIR==='asc')?1:-1;
  f.sort(function(a,b){
    var x=a[i], y=b[i];
    var nx=Number(x), ny=Number(y);
    if(isFinite(nx)&&isFinite(ny)&&x!==''&&y!=='') return (nx-ny)*dir;
    return String(x).localeCompare(String(y))*dir;
  });

  TOTAL=f.length;
  if(PAGE*SIZE>=TOTAL) PAGE=0;
  ROWS=f.slice(PAGE*SIZE,PAGE*SIZE+SIZE);

  var sv=0, rev=0, mar=0;
  f.forEach(function(r){
    var v=Number(r[IX.stock_value]); if(isFinite(v)&&v>0) sv+=v;
    var rv=Number(r[IX.revenue_365d]); if(isFinite(rv)) rev+=rv;
    var mg=Number(r[IX.margin_365d]); if(isFinite(mg)) mar+=mg;
  });
  $('sTotal').innerHTML='<b>'+TOTAL.toLocaleString('en-IN')+'</b> products';
  $('sVal').innerHTML='stock <b>'+rs(sv)+'</b>';
  $('sMarg').innerHTML='margin <b>'+pc(rev>0?mar/rev*100:'')+'</b> on '+rs(rev);
  $('pInfo').textContent=(TOTAL?PAGE*SIZE+1:0)+'–'+Math.min((PAGE+1)*SIZE,TOTAL);

function renderGrid(){
  if(!ROWS.length){$('gw').innerHTML='<div class="empty">No matches.</div>';return;}
  var h='<table class="g"><thead><tr>';
  GCOLS.forEach(function(f){
    h+='<th class="'+(GNUM[f]?'num':'')+'" data-f="'+f+'">'+esc(GLAB[f]||f)+
      (SORT===f?(DIR==='asc'?' \u25B2':' \u25BC'):'')+'</th>';
  });
  h+='</tr></thead><tbody>';
  ROWS.forEach(function(r){
    h+='<tr data-c="'+esc(r[IX.item_code])+'">';
    GCOLS.forEach(function(f){
      var v=r[IX[f]],cls=GNUM[f]?'num':'';
      var disp;
      if(f==='item_code'){cls+=' cd';disp=esc(v)}
      else if(f==='product_name'){cls+=' nm';disp=esc(v)}
      else if(f==='abc_revenue')disp=abcTag(v);
      else if(f==='xyz')disp=xyzTag(v);
      else if(f==='stock_value')disp=rs(v);
      else if(f==='qty_total'){disp=n2(v);if(Number(v)<0)cls+=' neg';}
      else if(f==='margin_pct')disp=pc(v);
      else if(f==='flags')disp='<span style="font-size:11px;color:var(--ink3)">'+esc(v)+'</span>';
      else if(GNUM[f])disp=n2(v);
      else disp=esc(v);
      h+='<td class="'+cls+'">'+disp+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  $('gw').innerHTML=h;
  var th=$('gw').querySelectorAll('th[data-f]');
  for(var i=0;i<th.length;i++)th[i].onclick=function(){
    var f=this.getAttribute('data-f');
    if(SORT===f)DIR=(DIR==='asc'?'desc':'asc');else{SORT=f;DIR='desc'}
    PAGE=0;loadGrid();
  };
  var tr=$('gw').querySelectorAll('tr[data-c]');
  for(var j=0;j<tr.length;j++)tr[j].onclick=function(){openDetail(this.getAttribute('data-c'))};
}

function loadCounts(){

      },function(e){toast(e,true);loadCounts()});

      askAction(this.getAttribute('data-defer'),'defer')}});
    each('[data-block]',function(el){el.onclick=function(ev){ev.stopPropagation();
      askAction(this.getAttribute('data-block'),'block')}});
  },function(e){$('vCounts').innerHTML='<div class="empty">'+esc(e)+'</div>'});
}
/* Accepts a selector string OR a NodeList. It used to take only a string, so
   every each(el.querySelectorAll(...)) call threw and its handlers never
   bound — that is why the drill-downs looked dead. */
function each(sel,fn){
  var el = (typeof sel==='string') ? document.querySelectorAll(sel) : sel;
  if(!el) return;
  for(var i=0;i<el.length;i++) fn(el[i]);
}

function askAction(code,act){
  $('ovAct').className='ov on';
  $('aT').textContent=(act==='defer'?'Defer ':'Block ')+code;
  $('aB').innerHTML='<div class="fld"><label>Reason</label>'+
    '<input id="aR" placeholder="'+(act==='defer'?'rack being rearranged':'item not traceable')+'"></div>'+
    (act==='defer'?'<div class="fld"><label>Come back on</label>'+
      '<input id="aU" placeholder="2026-08-20"></div>':'')+
    '<div style="margin-top:12px"><button class="btn p" id="aGo">Confirm</button></div>';
  $('aGo').onclick=function(){
    var r=$('aR').value.trim();
    if(!r){toast('A reason is required',true);return;}
    var u=$('aU')?$('aU').value.trim():'';
    this.disabled=true;
    api('countact',{code:code,act:act,note:r,until:u},function(){
      $('ovAct').className='ov';toast(act==='defer'?'Deferred':'Blocked');
      loadCounts();loadCountBadge();
    },function(e){toast(e,true);$('aGo').disabled=false});
  };
}

/* ══════════════════ LOCAL TABLE ══════════════════
   Ship every row once, then filter and sort in the browser. The office was
   round-tripping for every sort click; now nothing waits on the network. */
var ALL=null, ALOADING=false;
function loadAll(cb){
  if(ALL){cb&&cb();return}
  if(ALOADING){setTimeout(function(){loadAll(cb)},400);return}
  ALOADING=true;
  var acc=[],page=0;
  (function next(){
    api('catalog',{page:page},function(d){
      acc=acc.concat(d.rows||[]);
      if(page+1<d.pages){page++;next();return}
      ALL=acc;ALOADING=false;cb&&cb();
    },function(e){ALOADING=false;toast(e,true)});
  })();
}
function allWhere(fn){ return (ALL||[]).filter(fn); }

    gmroi:'GMROI',margin_pct:'Margin%',suggested_order:'Order',action:'Action'};

function drillCsv(top){

/* the five numbers that decide what to do, judged rather than listed */
function verdictStrip(p){
  var out='';
  var cover=Number(p.days_cover), gm=Number(p.gmroi), tn=Number(p.turns);
  var mp=Number(p.margin_pct), qty=Number(p.qty_total);

  out+=vbox('Stock cover', isFinite(cover)&&cover>0?Math.round(cover)+'d':'—',
    !isFinite(cover)||!cover ? ['',''] :
    cover<14?['bad','running out']:
    cover<30?['warn','getting thin']:
    cover<180?['good','comfortable']:['warn','a lot of cash parked']);

  out+=vbox('GMROI', isFinite(gm)?n2(gm):'—',
    !isFinite(gm)?['','']:
    gm<1?['bad','earns less than it ties up']:
    gm<2?['warn','thin return']:['good','earning its shelf space']);

  out+=vbox('Turns', isFinite(tn)?n2(tn):'—',
    !isFinite(tn)?['','']:
    tn<2?['bad','barely moving']:
    tn<4?['warn','below par']:['good','healthy']);

  out+=vbox('Margin', isFinite(mp)?pc(mp):'—',
    !isFinite(mp)?['','']:
    mp<0?['bad','selling at a loss']:
    mp<12?['warn','under the floor']:['good','above the floor']);

  out+=vbox('On hand', n2(p.qty_total),
    qty<0?['bad','impossible — count it']:
    qty===0?['warn','nothing on the shelf']:['','']);

  return '<div class="vstrip">'+out+'</div>';
}
function vbox(k,n,st){
  return '<div class="vbox '+(st[0]||'')+'"><div class="k">'+k+'</div>'+
    '<div class="n">'+n+'</div>'+(st[1]?'<div class="s">'+st[1]+'</div>':'')+'</div>';
}
function trendTag(t){
  if(!t)return '—';
  var c=t==='growing'?'t-x':(t==='declining'?'t-a':'t-c');
  return '<span class="tag '+c+'">'+esc(t)+'</span>';
}
function cvTag(cv){
  var v=Number(cv);
  if(!isFinite(v))return '—';
  var l=v<0.5?['t-x','stable']:(v<1?['t-b','variable']:['t-a','erratic']);
  return '<span class="tag '+l[0]+'">'+l[1]+'</span> '+n2(v);
}

/* ── PO progress as three dots, expanding on click ──
   A full bar on every row would swamp the table. Three dots read at a glance
   — ordered, shipped, received — and the detail is one click away. */
/* ── VT-022 · the Purchase Intelligence bar, small enough for a table row ──
   Same five segments and the same colours as the purchase dashboard, so the
   two read alike. A full-width bar per row would swamp the table, so it sits
   at 70px and expands on click. */
var PSEG=[['received','#29A36A'],['shipped','#F2B33D'],
          ['sent','#A8C6F0'],['created','#4C82E6'],['excess','#8B5CF6']];
function progSegs(x){
  var ord=Number(x.on_order)||0, tr=Number(x.in_transit)||0;
  var rec=Math.max(0,(Number(x.ordered)||0)-(Number(x.on_order)||0));
  var st=String(x.status||'');
  var shipped=Math.max(0,tr);
  var rest=Math.max(0,ord-shipped);
  /* a PO that has been sent is further along than one merely created */
  var sent=(st==='PO Sent'||st==='Shipped')?rest:0;
  var created=rest-sent;
  return {received:rec,shipped:shipped,sent:sent,created:created,excess:0,
          total:rec+shipped+sent+created};
}
function progDots(x){
  var f=progSegs(x);
  if(!f.total) return '';
  var bar=PSEG.map(function(s){
    var v=f[s[0]]||0;
    return v>0?'<span style="flex:'+v+';background:'+s[1]+'" title="'+s[0]+': '+v+'"></span>':'';
  }).join('');
  var payload=encodeURIComponent(JSON.stringify({
    n:x.name,o:x.on_order,t:x.in_transit,due:x.due||'',st:x.status||'',
    pos:x.pos||0,part:x.part_received||'',f:f}));
  return '<span class="prog" data-p="'+payload+'" title="click for detail">'+
    '<span class="pbar mini">'+bar+'</span></span>';
}
function togProg(el){
  var tr=el.closest('tr');
  var nx=tr.nextElementSibling;
  if(nx&&nx.className==='progrow'){ nx.parentNode.removeChild(nx); return; }
  var d={};
  try{ d=JSON.parse(decodeURIComponent(el.getAttribute('data-p'))); }catch(e){}
  var f=d.f||{};
  var bar=PSEG.map(function(s){
    var v=f[s[0]]||0;
    return v>0?'<span style="flex:'+v+';background:'+s[1]+'"></span>':'';
  }).join('');
  var legend=PSEG.filter(function(s){return (f[s[0]]||0)>0})
    .map(function(s){return '<span style="display:inline-flex;align-items:center;gap:4px;'+
      'margin-right:12px"><i style="width:9px;height:9px;border-radius:2px;'+
      'display:inline-block;background:'+s[1]+'"></i>'+s[0]+' '+qn2(f[s[0]])+'</span>'})
    .join('');
  var row=document.createElement('tr');
  row.className='progrow';
  row.innerHTML='<td colspan="9"><div class="progwrap">'+
    '<b>'+esc(d.n||'')+'</b>'+
    '<div class="pbar" style="height:13px;margin:7px 0">'+bar+'</div>'+
    '<div style="font-size:11px;color:var(--ink2);margin-bottom:4px">'+legend+'</div>'+
    'total PO request — '+qn2(f.total)+' qty'+
    (d.due?'  ·  due '+esc(d.due):'')+
    (d.part?'  ·  last received '+esc(d.part):'')+
    (d.pos?'  ·  across '+d.pos+' PO'+(d.pos>1?'s':''):'')+
    (d.st?'  ·  '+esc(d.st):'')+
    '</div></td>';
  tr.parentNode.insertBefore(row, tr.nextSibling);
}

/* ── VT-024 · the two ERP opinions, side by side ──
   vasy-batch (Cost_Current) is the live figure and leads. vasy-master
   (ERP_Snapshot) sits underneath. Where they disagree the margin above is a
   guess, so the gap is stated rather than averaged away. */
function costPanel(p){
  var gst=Number(p.gst_rate)||18;
  var inc=function(v){var n=Number(v);return isFinite(n)&&n?n*(1+gst/100):''};
  var gap=Number(p.price_gap);
  var flagged=isFinite(gap)&&Math.abs(gap)>=5;

  var h='<div class="sec" style="margin-top:18px">Cost and price by lane</div>';
  if(flagged){
    h+='<div class="card alert" style="margin-bottom:12px"><div class="l">'+
      'The two costs disagree</div><div style="font-size:14px;margin-top:3px">'+
      'Batch cost is <b>'+(gap>0?'+':'')+n2(gap)+'%</b> against the frozen cost the '+
      'margin above was computed from. Until that is settled the margin is a guess.'+
      '</div></div>';
  }
  h+='<table class="g"><thead><tr><th></th>'+
    '<th class="num">W ex GST</th><th class="num">W incl GST</th>'+
    '<th class="num">WO</th></tr></thead><tbody>'+

    '<tr><td><b>vasy-batch</b><div style="font-size:11px;color:var(--ink3)">'+
      'Cost_Current — the live cost</div></td>'+
      '<td class="num">'+n2(p.cost_current_w)+'</td>'+
      '<td class="num">'+n2(inc(p.cost_current_w))+'</td>'+
      '<td class="num">'+n2(p.cost_current_wo)+'</td></tr>'+

    '<tr><td>vasy-master<div style="font-size:11px;color:var(--ink3)">'+
      'frozen on build day ('+esc(p.cost_source||'—')+')</div></td>'+
      '<td class="num">'+n2(p.cost_frozen)+'</td>'+
      '<td class="num">'+n2(inc(p.cost_frozen))+'</td>'+
      '<td class="num">—</td></tr>'+

    /* VT-011b: the bill rate and the landing figure are different numbers,
       and the gap between them is transport that was folded into cost. */
    '<tr><td>bill rate<div style="font-size:11px;color:var(--ink3)">'+
      'what the supplier invoiced'+(p.cost_bill_date?' · '+esc(p.cost_bill_date):'')+
      '</div></td>'+
      '<td class="num">'+n2(p.cost_bill_w)+'</td>'+
      '<td class="num">'+n2(inc(p.cost_bill_w))+'</td>'+
      '<td class="num">'+n2(p.cost_bill_wo)+'</td></tr>'+

    '<tr><td>landing cost<div style="font-size:11px;color:var(--ink3)">'+
      'bill rate plus whatever was loaded onto it</div></td>'+
      '<td class="num">'+n2(p.landing_w)+'</td>'+
      '<td class="num">'+n2(inc(p.landing_w))+'</td>'+
      '<td class="num">'+n2(p.landing_wo)+'</td></tr>'+

    (Number(p.landing_w)&&Number(p.cost_bill_w)?
      '<tr><td style="color:var(--amber);font-weight:700">loaded on top'+
      '<div style="font-size:11px;color:var(--ink3)">the gap — transport, '+
      'folded into cost</div></td>'+
      '<td class="num" style="color:var(--amber);font-weight:700">'+
        n2(Number(p.landing_w)-Number(p.cost_bill_w))+'</td>'+
      '<td class="num">—</td>'+
      '<td class="num" style="color:var(--amber);font-weight:700">'+
        (Number(p.landing_wo)&&Number(p.cost_bill_wo)?
          n2(Number(p.landing_wo)-Number(p.cost_bill_wo)):'—')+'</td></tr>':'')+

    '<tr><td><b>selling</b><div style="font-size:11px;color:var(--ink3)">'+
      'what it goes out at</div></td>'+
      '<td class="num">'+n2(exG(p.sell_price_w,gst))+'</td>'+
      '<td class="num"><b>'+n2(p.sell_price_w)+'</b></td>'+
      '<td class="num">'+n2(p.sell_price_wo)+'</td></tr>'+

    '<tr><td>selling · vasy-master<div style="font-size:11px;color:var(--ink3)">'+
      'ERP_Snapshot</div></td>'+
      '<td class="num">'+n2(exG(p.sell_master_w,gst))+'</td>'+
      '<td class="num">'+n2(p.sell_master_w)+'</td>'+
      '<td class="num">'+n2(p.sell_master_wo)+'</td></tr>'+

    '</tbody></table>'+
    '<div class="hint" style="margin-top:8px">W prices are quoted including '+
    'GST at '+gst+'%; the ex-GST column is derived. WO carries no tax component.</div>';

  if(p.margin_vs_cat!==''&&p.margin_vs_cat!==undefined&&isFinite(p.margin_vs_cat)){
    var d=Number(p.margin_vs_cat);
    h+='<div class="card '+(d<-10?'warn':'')+'" style="margin-top:12px">'+
      '<div class="l">Against its category</div>'+
      '<div style="font-size:15px;font-weight:750;margin-top:3px">'+
      (d>=0?'+':'')+n2(d)+' points vs the '+esc(p.category)+' median of '+
      pc(p.cat_median_margin)+'</div></div>';
  }
  return h;
}
function exG(v,gst){var n=Number(v);return isFinite(n)&&n?n/(1+(Number(gst)||18)/100):''}


/* ══════════════ VT-033 · WHAT CHANGED SINCE YESTERDAY ══════════════
   Everything else here answers a question you thought to ask. This one
   tells you what moved without being asked, which is the only way a problem
   gets noticed on the day it starts rather than the week it is discovered. */
function loadDigest(){
  api('digest',{},function(d){renderDigest(d)},function(){});
}
function renderDigest(d){
  var host=$('vToday'); if(!host)return;
  var box=document.createElement('div');
  if(d.first_run){
    box.innerHTML='<div class="hint" style="margin-bottom:16px">'+
      '<b>Change tracking starts tonight.</b> Today\'s state has been recorded; '+
      'from tomorrow this shows what moved.</div>';
    host.insertBefore(box,host.firstChild);
    return;
  }
  var n=(d.new_stockout_n||0)+(d.new_cost_flag_n||0)+(d.new_negative_n||0);
  if(!n&&!d.recovered_n){
    box.innerHTML='<div class="hint" style="margin-bottom:16px">'+
      'Nothing changed since yesterday.</div>';
    host.insertBefore(box,host.firstChild);
    return;
  }
  var grp=function(title,items,total,cls,note){
    if(!total)return '';
    return '<div style="margin-bottom:10px"><b class="'+(cls||'')+'">'+title+
      '  ('+total+')</b>'+
      (note?'<div style="font-size:11.5px;color:var(--ink3)">'+note+'</div>':'')+
      '<div style="font-size:12.5px;margin-top:4px">'+
      items.slice(0,6).map(function(x){
        return '<span class="clik dgi" data-c="'+esc(x.code)+'" style="display:inline-block;'+
          'margin:2px 8px 2px 0;padding:2px 9px;border-radius:20px;'+
          'background:var(--stone-l)">'+esc(x.name)+'</span>';
      }).join('')+
      (total>6?'<span style="color:var(--ink3)"> +'+(total-6)+' more</span>':'')+
      '</div></div>';
  };
  box.innerHTML='<div class="card" style="margin-bottom:18px;padding:16px">'+
    '<div class="l">Since yesterday</div>'+
    grp('Went out of stock',d.new_stockout,d.new_stockout_n,'bad',
      'these were selling and are now at zero')+
    grp('Back in stock',d.recovered,d.recovered_n,'',
      'no longer stocked out')+
    grp('Cost flag appeared',d.new_cost_flag,d.new_cost_flag_n,'bad',
      'margin turned negative, or the cost went stale')+
    grp('Went negative',d.new_negative,d.new_negative_n,'bad',
      'impossible quantities — someone needs to count these')+
    '</div>';
  host.insertBefore(box,host.firstChild);
  each(box.querySelectorAll('.dgi'),function(el){
    el.onclick=function(){openDetail(this.getAttribute('data-c'))}});
}
</script>
</body>
</html>
