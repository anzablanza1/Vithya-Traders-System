<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconciliation</title>
<style>
:root{
  --brand:#CC3018; --brand-d:#A72410; --brand-l:#FBEDEA; --stone:#6C6C60; --stone-l:#F2F1EE;
  --w:#1D5FA8; --w-l:#E9F0F9;
  --ink:#1A1A17; --ink2:#4A4A42; --ink3:#8A8A7E; --line:#E2E0DA; --line2:#F0EFEB;
  --bg:#F6F5F2; --card:#fff;
  --green:#2C6B4A; --green-bg:#E9F3ED; --amber:#A8730F; --amber-bg:#FDF5E4;
  --red:#B3372C; --red-bg:#FBEEEC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{height:26px}
.ttl{font-weight:750;font-size:15px}
.sub{font-size:12px;color:var(--ink3)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--stone-l)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand-d)}
.wrap{padding:16px 18px;max-width:1500px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card.on{border-color:var(--brand);background:var(--brand-l)}
.card .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.card .n{font-size:21px;font-weight:750;margin-top:3px;font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--ink2);margin-top:2px}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],select,input[type=number],input[type=date]{
  padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;
  background:var(--card);color:var(--ink);font-family:inherit}
input[type=text]:focus,select:focus{outline:none;border-color:var(--brand)}
/* overflow:hidden on a table (or any ancestor) silently disables
   position:sticky on its own <th>. That is why the header would not freeze
   through two attempts — the CSS was right, this one property cancelled it.
   Rounding moves to a wrapper so the corners still look right. */
table{width:100%;border-collapse:collapse;background:var(--card);font-size:13px}
.tblwrap{border:1px solid var(--line);border-radius:13px;overflow:visible}
th{background:var(--stone-l);text-align:left;padding:9px 11px;font-weight:700;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink2);
  position:sticky;top:56px;z-index:10;
  /* the stone background is slightly translucent; force it solid or rows
     show through as they scroll under the header */
  background-color:#EDE9E3;box-shadow:0 1px 0 var(--line)}
td{padding:9px 11px;border-top:1px solid var(--line2);vertical-align:top}
tr.r:hover{background:var(--stone-l);cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.big{font-weight:700}
.neg{color:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.p1{background:var(--green-bg);color:var(--green)}
.p2{background:var(--w-l);color:var(--w)}
.p3{background:var(--amber-bg);color:var(--amber)}
.p4{background:var(--stone-l);color:var(--ink3)}
.empty{padding:36px;text-align:center;color:var(--ink3)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(26,26,23,.45);display:none;z-index:60;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow:auto}
.ov.on{display:flex}
.panel{background:var(--bg);border-radius:15px;width:100%;max-width:1000px;overflow:hidden}
.ph{display:flex;align-items:center;gap:11px;padding:14px 17px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0}
.pb{padding:17px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:15px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px}
.kv .l{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.kv .v{font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.form{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:15px}
.form h3{font-size:13px;margin-bottom:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:10px}
.frow label{display:block;font-size:11px;color:var(--ink3);margin-bottom:3px}
.frow input,.frow select{width:100%}
.note{font-size:12px;color:var(--ink2);background:var(--amber-bg);border-radius:9px;
  padding:9px 11px;margin-bottom:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 17px;border-radius:9px;font-size:13px;z-index:99;display:none}
.toast.on{display:block}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);
  margin:15px 0 7px;font-weight:700}

/* in-credit: a different problem to a debt, so a different colour.
   Blue reads as "money sitting here", not "money missing". */
.card.p5{border-left-color:#1D5FA8}
.cr{color:#1D5FA8}
.pill.p5{background:#E9F0F9;color:#1D5FA8}
</style>
<style>
/* Shown until a URL is set. The floor and office apps have the same box, so
   anyone who can connect one can connect this. */
#conn{position:fixed;inset:0;background:var(--bg);z-index:99;
  display:none;align-items:center;justify-content:center;padding:24px}
#conn .box{max-width:520px;width:100%}
#conn h2{font-size:20px;font-weight:750;margin:0 0 6px}
#conn p{color:var(--ink2);font-size:14px;line-height:1.5;margin:0 0 16px}
#conn input{width:100%;padding:12px 14px;font-size:14px;border:1.5px solid var(--line);
  border-radius:10px;font-family:inherit}
#conn input:focus{outline:none;border-color:var(--brand)}
#conn .go{margin-top:12px;padding:11px 20px;border:none;border-radius:10px;
  background:var(--brand);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
#connMsg{margin-top:12px;font-size:13px;color:var(--red);min-height:18px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;
  vertical-align:middle}
</style></head><body>

<div id="conn">
  <div class="box">
    <h2>Connect to your data</h2>
    <p>Paste the Apps Script web app URL. Deploy with
       <b>Access: Anyone</b> — a URL containing <code>/a/macros/</code> needs a
       Google login this page cannot provide.</p>
    <input id="connUrl" placeholder="https://script.google.com/macros/s/.../exec"
           autocomplete="off" spellcheck="false">
    <button class="go" id="connGo">Connect</button>
    <div id="connMsg"></div>
  </div>
</div>

<script>
var ROWS=null, CUR=null, INV=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n0(v){var n=Number(v);return isFinite(n)?Math.round(n).toLocaleString('en-IN'):'—'}
function toast(m){var t=$('toast');t.textContent=m;t.className='toast on';
  setTimeout(function(){t.className='toast'},2600)}
/* This used google.script.run, which ONLY exists when Apps Script serves
   the page. Opened as a file it does not exist, so every call hung and the
   screen loaded forever with nothing to click.
   The floor and office apps use JSONP against the /exec URL — same pattern
   here, so all three behave alike and all three work from a local file. */
var CFG={url:''},SEQ=0;
function call(action,params,ok,err){
  if(!CFG.url){ err&&err('Not connected'); return; }
  var cb='vtr'+(++SEQ)+'_'+Date.now(), done=false, s=document.createElement('script');
  var t=setTimeout(function(){ if(done)return; done=true; clean();
    err&&err('Timed out after 30s'); },30000);
  function clean(){ try{delete window[cb]}catch(e){window[cb]=undefined}
    if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(t); }
  window[cb]=function(r){ if(done)return; done=true; clean();
    if(r&&r.ok) ok&&ok(r.data); else err&&err(r&&r.error?r.error:'Error'); };
  var qs=['app=recon','action='+encodeURIComponent(action),'callback='+cb];
  for(var k in (params||{})){ var v=params[k];
    if(v!==undefined&&v!==null&&v!=='') qs.push(k+'='+encodeURIComponent(v)); }
  s.src=CFG.url+(CFG.url.indexOf('?')<0?'?':'&')+qs.join('&');
  s.onerror=function(){ if(done)return; done=true; clean();
    err&&err('Could not reach that URL'); };
  document.body.appendChild(s);
}

/* ---- connect ---- */
function saveUrl(u){
  CFG.url=String(u||'').trim();
  try{ localStorage.setItem('vt_recon_url',CFG.url); }catch(e){}
}
function loadUrl(){
  try{ CFG.url=localStorage.getItem('vt_recon_url')||''; }catch(e){ CFG.url=''; }
  return CFG.url;
}
function showConnect(msg){
  $('conn').style.display='flex';
  $('connMsg').textContent=msg||'';
  $('connUrl').value=CFG.url||'';
  $('app').style.display='none';
}
function tryConnect(){
  var u=$('connUrl').value.trim();
  if(!u){ $('connMsg').textContent='Paste the web app URL first.'; return; }
  if(u.indexOf('/a/macros/')>=0){
    $('connMsg').textContent='That URL needs a Google login, which this page '+
      'cannot provide. Deploy again with Access: Anyone and use the URL '+
      'without /a/macros/ in it.';
    return;
  }
  saveUrl(u);
  $('connMsg').textContent='Checking…';
  call('summary',null,function(){ $('conn').style.display='none';
    $('app').style.display='block'; load(); },
    function(e){ $('connMsg').textContent=String(e); });
}

/* the five buckets, in the order they should be worked */
/* These must match v_reconciliation.next_step exactly. The view was rebuilt
   to separate customers who are IN CREDIT from those who owe — 64 of them
   hold Rs 61.98 lakh, and subtracting a negative balance was producing
   "Rs 17 lakh to write off" against a customer who owes nothing. */
var BUCKETS=[
  ['1. AGREES — just confirm','the two reports already match','p2'],
  ['2. NO HISTORY — confirm and close','nothing before April to argue about','p1'],
  ['3. IN CREDIT — refund or apply','they have paid more than they were billed','p5'],
  ['4. CHECK WITH CUSTOMER','needs a conversation','p3'],
  ['4. NOT IN THE LEDGER — check','invoices exist, no ledger account','p3'],
  ['4. DISPUTED','','p3'],
  ['5. DONE','signed off','p4']
];
var FILTER='',LEDGER={invoices:[],receipts:[]};


window.addEventListener('DOMContentLoaded',function(){
  $('connGo').onclick=tryConnect;
  $('connUrl').addEventListener('keydown',function(e){
    if(e.key==='Enter')tryConnect();});
  if(loadUrl()){
    $('app').style.display='block';
    call('summary',null,function(){ load(); },
      function(e){ showConnect(String(e)); });
  } else {
    showConnect('');
  }
});

function load(force){
  $('tbl').innerHTML='<div class="empty"><span class="spin"></span>loading…</div>';
  call('rows',null,function(rows){ ROWS=rows||[]; draw(); },
    function(e){ $('tbl').innerHTML='<div class="empty">'+esc(e.message||e)+'</div>' });
}

function draw(){
  var by={}, tot=0, done=0, owed=0, credit=0;
  ROWS.forEach(function(r){
    var k=r.next_step||'—';
    if(!by[k])by[k]={n:0,v:0};
    by[k].n++; by[k].v+=Number(r.to_write_off)||0;
    tot+=Number(r.to_write_off)||0;
    /* owed and credit are kept apart. Netting them gave Rs 1.37 crore, which
       is true but hides that 605 customers owe Rs 1.99 crore while 64 sit on
       Rs 62 lakh of credit — two different jobs. */
    owed   += Number(r.owes)||0;
    credit += Number(r.in_credit)||0;
    if(String(r.next_step).indexOf('5.')===0)done++;
  });
  $('sub').innerHTML=ROWS.length.toLocaleString('en-IN')+' customers'+
    '  ·  <b>'+n0(owed)+'</b> owed'+
    (credit?'  ·  <b class="cr">'+n0(credit)+'</b> in credit':'')+
    '  ·  '+n0(tot)+' to write off'+
    '  ·  '+done+' signed off';

  $('cards').innerHTML=BUCKETS.map(function(b){
    var d=by[b[0]]||{n:0,v:0};
    return '<div class="card'+(FILTER===b[0]?' on':'')+'" data-b="'+esc(b[0])+'">'+
      '<div class="l">'+esc(b[0])+'</div>'+
      '<div class="n">'+d.n+'</div>'+
      '<div class="s">'+(d.v?n0(d.v)+' to close':(b[1]||''))+'</div></div>';
  }).join('');
  each($('cards').querySelectorAll('[data-b]'),function(el){
    el.onclick=function(){
      var b=this.getAttribute('data-b');
      FILTER = (FILTER===b) ? '' : b;
      draw();
    }});
  rows();
}

function rows(){
  var q=$('q').value.trim().toLowerCase();
  var st=$('fStatus').value, sort=$('fSort').value;
  var out=ROWS.filter(function(r){
    if(FILTER && r.next_step!==FILTER) return false;
    if(st && (r.status||'NOT CHECKED')!==st) return false;
    if(q && String(r.customer||'').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  out.sort(function(a,b){
    if(sort==='name') return String(a.customer).localeCompare(String(b.customer));
    if(sort==='ledger') return (Number(b.ledger_closing)||0)-(Number(a.ledger_closing)||0);
    if(sort==='oldest') return (Number(b.unpaid_bills)||0)-(Number(a.unpaid_bills)||0);
    return Math.abs(Number(b.to_write_off)||0)-Math.abs(Number(a.to_write_off)||0);
  });
  $('count').textContent=out.length.toLocaleString('en-IN')+' shown';
  if(!out.length){ $('tbl').innerHTML='<div class="empty">nothing matches</div>'; return; }

  $('tbl').innerHTML='<table><thead><tr>'+
    '<th>Customer</th><th class="num">Ledger says</th><th class="num">Invoices say</th>'+
    '<th class="num">To write off</th><th class="num">Bills</th>'+
    '<th class="num">Before Apr</th><th class="num">This year</th>'+
    '<th>Status</th><th>Next step</th></tr></thead><tbody>'+
    out.slice(0,400).map(function(r){
      var gap=Number(r.to_write_off)||0;
      var cls=BUCKETS.filter(function(b){return b[0]===r.next_step})[0];
      return '<tr class="r" data-c="'+esc(r.customer)+'">'+
        '<td class="big">'+esc(r.customer)+'</td>'+
        '<td class="num">'+n0(r.ledger_closing)+'</td>'+
        '<td class="num">'+n0(r.invoice_outstanding)+'</td>'+
        '<td class="num big'+(gap<0?' neg':'')+'">'+n0(gap)+'</td>'+
        '<td class="num">'+n0(r.unpaid_bills)+'</td>'+
        '<td class="num">'+n0(r.prior_open)+'</td>'+
        '<td class="num">'+n0(r.fy2627_open)+'</td>'+
        '<td>'+(r.status&&r.status!=='NOT CHECKED'
          ? '<span class="pill p1">'+esc(r.status)+'</span>' : '')+'</td>'+
        '<td><span class="pill '+(cls?cls[2]:'p4')+'">'+esc(r.next_step||'')+'</span></td>'+
        '</tr>';
    }).join('')+'</tbody></table>'+
    (out.length>400?'<div class="empty">showing the first 400 of '+
      out.length.toLocaleString('en-IN')+' — narrow the search</div>':'');

  each($('tbl').querySelectorAll('tr[data-c]'),function(tr){
    tr.onclick=function(){ open_(this.getAttribute('data-c')) }});
}

function open_(name){
  CUR=null;
  ROWS.forEach(function(r){ if(r.customer===name) CUR=r });
  if(!CUR) return;
  $('pName').textContent=name;
  $('pSub').textContent=CUR.contact_no||'';
  $('ov').className='ov on';
  $('pBody').innerHTML='<div class="empty"><span class="spin"></span>loading invoices…</div>';
  /* the JSONP router reads p.customer; passing the bare name meant the
     server got nothing and every panel showed "0 open invoices" */
  call('invoices',{customer:name},function(d){
    LEDGER=d||{invoices:[],receipts:[]}; panel(); },
    function(e){ LEDGER={invoices:[],receipts:[]}; panel(); toast(String(e.message||e)) });
}

function panel(){
  var r=CUR;
  var gap=Number(r.to_write_off)||0;
  var h='<div class="kv">'+
    '<div><div class="l">Ledger closing</div><div class="v">'+n0(r.ledger_closing)+'</div></div>'+
    '<div><div class="l">Invoices open</div><div class="v">'+n0(r.invoice_outstanding)+'</div></div>'+
    '<div><div class="l">To write off</div><div class="v'+(gap<0?' neg':'')+'">'+n0(gap)+'</div></div>'+
    '<div><div class="l">Ledger opening</div><div class="v">'+n0(r.ledger_opening)+'</div></div>'+
    '<div><div class="l">Before Apr 2026</div><div class="v">'+n0(r.prior_open)+'</div></div>'+
    '<div><div class="l">This year</div><div class="v">'+n0(r.fy2627_open)+'</div></div>'+
    '</div>';

  if(gap>1){
    h+='<div class="note"><b>'+n0(gap)+'</b> more shows on the invoices than the ledger '+
       'says is owed — money received but never applied to a bill. The receipts and '+
       'invoices below are colour-matched so you can see which is which before closing '+
       'anything.</div>';
  } else if(gap<-1){
    h+='<div class="note">The ledger says <b>'+n0(-gap)+'</b> MORE is owed than the open '+
       'invoices show. Do not write anything off here — this needs a charge or an '+
       'opening-balance correction, not a closure.</div>';
  }

  h+='<div class="form"><h3>Record the decision</h3>'+
    '<div class="frow">'+
      '<div><label>Opening balance agreed</label>'+
        '<input type="number" id="fOpen" value="'+
        (r.opening_agreed!=null?r.opening_agreed:(r.ledger_opening||''))+'"></div>'+
      '<div><label>Status</label><select id="fSt">'+
        ['NOT CHECKED','CONFIRMED WITH CUSTOMER','DISPUTED','WRITTEN OFF'].map(function(s){
          return '<option'+((r.status||'NOT CHECKED')===s?' selected':'')+'>'+s+'</option>'}).join('')+
        '</select></div>'+
      '<div><label>Checked by</label><input type="text" id="fBy" value="'+
        esc(r.verified_by||'')+'"></div>'+
      '<div><label>How</label><select id="fHow">'+
        ['','phone','email','statement','visit'].map(function(s){
          return '<option'+((r.method||'')===s?' selected':'')+'>'+s+'</option>'}).join('')+
        '</select></div>'+
      '<div><label>On</label><input type="date" id="fOn" value="'+
        esc(r.verified_on||new Date().toISOString().slice(0,10))+'"></div>'+
    '</div>'+
    '<div class="frow"><div style="grid-column:1/-1"><label>Note</label>'+
      '<input type="text" id="fNote" value="'+esc(r.note||'')+'"></div></div>'+
    '<button class="btn pri" id="bSave">Save</button></div>';

  /* ---- the full ledger: colour-coded so a receipt and the invoices it
     closed share a colour, and on-account money stands out ---- */
  var invs=(LEDGER.invoices||[]), rcpts=(LEDGER.receipts||[]);

  /* give each receipt a colour, and map invoice_no -> that colour */
  var PAL=['#1D5FA8','#2E7D32','#8E44AD','#C0392B','#00838F','#B8860B',
           '#5D4037','#AD1457','#37474F','#558B2F'];
  var invColour={}, rcColour={};
  rcpts.forEach(function(r,i){
    var col=PAL[i%PAL.length]; rcColour[r.receipt_no]=col;
    String(r.against_invoices||'').split(',').forEach(function(inv){
      inv=inv.trim(); if(inv) invColour[inv]=col;
    });
  });

  var open=invs.filter(function(x){return x.status==='OPEN'});
  var closed=invs.filter(function(x){return x.status==='CLOSED'});
  var onAcct=rcpts.filter(function(r){return String(r.applied_to).indexOf('UNAPPLIED')===0});
  var onAcctVal=onAcct.reduce(function(s,r){return s+(Number(r.amount)||0)},0);

  h+='<div class="sec">Receipts — '+rcpts.length+
     (onAcct.length?'  ·  <b class="cr">'+onAcct.length+' on account, '+n0(onAcctVal)+
      ' unassigned</b>':'')+'</div>';
  if(!rcpts.length){ h+='<div class="empty">no receipts recorded (17 Aug 2026 onward only)</div>'; }
  else {
    h+='<table><thead><tr><th>Receipt</th><th>Date</th><th>Mode</th>'+
       '<th class="num">Amount</th><th>Applied to</th></tr></thead><tbody>'+
      rcpts.map(function(r){
        var col=rcColour[r.receipt_no];
        var un=String(r.applied_to).indexOf('UNAPPLIED')===0;
        return '<tr>'+
          '<td><span class="dot" style="background:'+(un?'#bbb':col)+'"></span>'+
            esc(r.receipt_no)+'</td>'+
          '<td>'+esc(r.receipt_date||'')+'</td>'+
          '<td>'+esc(r.mode||'')+'</td>'+
          '<td class="num">'+n0(r.amount)+'</td>'+
          '<td'+(un?' class="cr"':'')+'>'+esc(r.applied_to||'')+'</td></tr>';
      }).join('')+'</tbody></table>';
  }

  h+='<div class="sec">Open invoices — '+open.length+'</div>';
  h+=invTable(open, invColour, true);

  h+='<div class="sec">Closed invoices — '+closed.length+
     '  <span style="font-weight:400;color:var(--ink3)">(already settled — do NOT write these off)</span></div>';
  h+=invTable(closed.slice(0,200), invColour, false);
  if(closed.length>200) h+='<div class="empty">showing 200 of '+closed.length+'</div>';

  $('pBody').innerHTML=h;
  $('bSave').onclick=save;
}

/* one invoice table, dot colour matching the receipt that closed it */
function invTable(rows, invColour, isOpen){
  if(!rows.length) return '<div class="empty">none</div>';
  return '<table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Age</th>'+
    '<th class="num">Total</th><th class="num">Paid</th><th class="num">'+
    (isOpen?'Open':'Balance')+'</th><th>Type</th><th>Period</th>'+
    '<th>Receipt</th></tr></thead><tbody>'+
    rows.map(function(x){
      var col=invColour[String(x.invoice_no||'').trim()]||
              invColour[String(x.order_no||'').trim()];
      var prior=x.period==='PRIOR';
      return '<tr>'+
        '<td>'+(col?'<span class="dot" style="background:'+col+'"></span>':'')+
          esc(x.invoice_no||x.order_no||'')+'</td>'+
        '<td>'+esc(x.sales_date||'')+'</td>'+
        '<td class="num">'+n0(x.age_days)+'</td>'+
        '<td class="num">'+n0(x.total)+'</td>'+
        '<td class="num">'+n0(x.paid_amount)+'</td>'+
        '<td class="num big">'+n0(x.balance)+'</td>'+
        '<td>'+esc(x.inv_type||'')+'</td>'+
        '<td><span class="pill '+(prior?'p3':'p2')+'">'+
          (prior?'before Apr':'this year')+'</span></td>'+
        '<td>'+esc(x.receipts||'')+'</td></tr>';
    }).join('')+'</tbody></table>';
}

function save(){
  var b=$('bSave');
  b.disabled=true; b.textContent='saving…';
  call('save',{
    customer: CUR.customer,
    opening:  $('fOpen').value,
    perVasy:  CUR.ledger_opening,
    status:   $('fSt').value,
    by:       $('fBy').value,
    on:       $('fOn').value,
    method:   $('fHow').value,
    note:     $('fNote').value
  }, function(res){
    b.disabled=false; b.textContent='Save';
    toast(res.customer+' → '+res.status);
    $('ov').className='ov';
    load(true);
  }, function(e){
    b.disabled=false; b.textContent='Save';
    toast(String(e.message||e));
  });
}

function each(list,fn){
  var el=(typeof list==='string')?document.querySelectorAll(list):list;
  for(var i=0;i<el.length;i++) fn(el[i]);
}

$('bClose').onclick=function(){ $('ov').className='ov' };
$('bRefresh').onclick=function(){ load(true) };
$('q').oninput=rows;
$('fStatus').onchange=rows;
$('fSort').onchange=rows;
load();
</script></div>
</body></html>
