<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vithya — Receivables</title>
<style>
:root{
  --brand:#CC3018; --brand-d:#A72410; --brand-l:#FBEDEA; --stone:#6C6C60; --stone-l:#F2F1EE;
  --w:#1D5FA8; --w-l:#E9F0F9;
  --ink:#1A1A17; --ink2:#4A4A42; --ink3:#8A8A7E; --line:#E2E0DA; --line2:#F0EFEB;
  --bg:#F6F5F2; --card:rgba(255,255,255,.86);
  --green:#2C6B4A; --green-bg:#E9F3ED; --amber:#A8730F; --amber-bg:#FDF5E4;
  --red:#B3372C; --red-bg:#FBEEEC;
  --glass:saturate(160%) blur(18px);
  --sh:0 1px 2px rgba(26,26,23,.05),0 8px 28px rgba(26,26,23,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13.5px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 560px at 8% -8%,rgba(204,48,24,.10),transparent 60%),
    radial-gradient(860px 480px at 96% 4%,rgba(108,108,96,.12),transparent 60%),var(--bg);
  background-attachment:fixed;min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 60px}
.top{display:flex;align-items:center;gap:13px;padding:12px 0 18px}
.logo{height:28px;display:block}
.bsub{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--stone);
  font-weight:700;border-left:1px solid var(--line);padding-left:11px}
.spacer{flex:1}
.meta{font-size:11.5px;color:var(--ink3)}

.drop{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;
  box-shadow:var(--sh)}
.drop.ok{border-style:solid;border-color:var(--green);background:rgba(233,243,237,.7)}
.drop h3{margin:0 0 4px;font-size:14.5px;font-weight:750}
.drop p{margin:0 0 12px;color:var(--ink3);font-size:12.5px}
.drop input[type=file]{display:none}
.pick{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--brand);
  color:#fff;font-weight:700;cursor:pointer}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.two{grid-template-columns:1fr}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}
.card{background:var(--card);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);
  border:1px solid rgba(226,224,218,.9);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
.card .l{font-size:10.5px;font-weight:750;letter-spacing:.6px;text-transform:uppercase;color:var(--ink3)}
.card .v{font-size:22px;font-weight:750;letter-spacing:-.5px;margin-top:4px;
  font-variant-numeric:tabular-nums}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.card.g{border-color:#BFD9C9;background:rgba(233,243,237,.8)} .card.g .v{color:var(--green)}
.card.a{border-color:#F0DCB8;background:rgba(253,245,228,.8)} .card.a .v{color:var(--amber)}
.card.r{border-color:#E8BDB7;background:rgba(251,238,236,.8)} .card.r .v{color:var(--red)}

.tabs{display:flex;gap:3px;margin:18px 0 12px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:650;
  border:1px solid var(--line);background:rgba(255,255,255,.7)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .n{opacity:.75;margin-left:5px}

.hint{background:var(--card);border:1px solid rgba(226,224,218,.9);border-radius:12px;
  padding:13px 16px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-bottom:14px;
  box-shadow:var(--sh)}
.hint b{color:var(--ink)}
.hint.big{font-size:13.5px;border-left:3px solid var(--brand)}

table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);
  border:1px solid rgba(226,224,218,.9);border-radius:13px;overflow:hidden;
  font-variant-numeric:tabular-nums;box-shadow:var(--sh)}
.t th{background:rgba(248,247,244,.92);padding:9px 11px;text-align:left;font-size:10.5px;
  font-weight:750;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;
  border-bottom:1.5px solid var(--line);white-space:nowrap;cursor:pointer}
.t th:hover{background:var(--brand-l)}
.t th.num,.t td.num{text-align:right}
.t td{padding:8px 11px;border-bottom:1px solid var(--line2)}
.t tr:last-child td{border-bottom:none}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:rgba(255,255,255,.95)}
.nm{font-weight:600;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:750;margin-right:6px}
.lane.w{background:var(--w-l);color:var(--w)} .lane.wo{background:var(--brand-l);color:var(--brand)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.p-full{background:var(--green-bg);color:var(--green)}
.p-part{background:var(--amber-bg);color:var(--amber)}
.p-over{background:var(--red-bg);color:var(--red)}
.p-none{background:var(--stone-l);color:var(--stone)}
.neg{color:var(--red)}

.bar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input[type=text]{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;
  min-width:250px;outline:none;background:#fff}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-weight:650}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.err{background:var(--red-bg);border:1px solid #E8BDB7;color:var(--red);border-radius:11px;
  padding:12px 15px;margin-bottom:12px;font-size:12.5px}

.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin:14px 0 26px}
.bars .b{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars .b.old{background:var(--red)}
.bars .b span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--ink3);white-space:nowrap}
.bars .b em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);
  font-size:10.5px;font-style:normal;font-weight:700;white-space:nowrap}

.ov{position:fixed;inset:0;background:rgba(26,26,23,.4);display:none;z-index:60;
  align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}
.ov.on{display:flex}
.panel{background:#fff;border-radius:15px;width:100%;max-width:980px;
  box-shadow:0 18px 50px rgba(26,26,23,.26)}
.ph{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  position:sticky;top:0;background:#fff;border-radius:15px 15px 0 0;z-index:2}
.ph h3{margin:0;font-size:16px;font-weight:750;flex:1}
.x{cursor:pointer;color:var(--ink3);font-size:24px;line-height:1;padding:0 6px}
.pb{padding:18px 20px 26px}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);
  font-weight:750;margin:20px 0 9px}
.sec:first-child{margin-top:0}
.kv{font-size:13px}
.kv .r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2)}
.kv .r:last-child{border-bottom:none}
.kv .r.tot{border-top:1.5px solid var(--line);border-bottom:none;font-weight:750;margin-top:3px;
  padding-top:9px}
.kv .k{color:var(--ink2)} .kv .v{font-weight:650;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
.verdict{border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.65;margin:16px 0}
.verdict.good{background:var(--green-bg);border:1px solid #BFD9C9}
.verdict.warn{background:var(--amber-bg);border:1px solid #F0DCB8}
.verdict.bad{background:var(--red-bg);border:1px solid #E8BDB7}
.verdict b{font-weight:750}
.flow{display:flex;align-items:center;gap:0;margin:12px 0 4px;flex-wrap:wrap}
.fb{flex:1;min-width:120px;padding:11px 13px;background:var(--stone-l);border-radius:10px;
  text-align:center}
.fb .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700}
.fb .v{font-size:16px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.fa{padding:0 10px;color:var(--ink3);font-size:17px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.mini th{text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line);font-size:10px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:750}
.mini td{padding:6px 8px;border-bottom:1px solid var(--line2)}
.mini th.num,.mini td.num{text-align:right}
.tg{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700}
.tg-ab{background:var(--green-bg);color:var(--green)}
.tg-oa{background:var(--amber-bg);color:var(--amber)}
.tg-ad{background:var(--w-l);color:var(--w)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" id="logo" alt="Vithya Traders">
    <span class="bsub">Receivables</span>
    <div class="spacer"></div>
    <span class="meta" id="meta"></span>
  </div>
  <div id="load">
    <div class="hint">Everything runs <b>in this page</b> — nothing is uploaded and nothing is
      written to your sheets. Pick both Vasy exports (.xlsx or .csv).</div>
    <div class="two">
      <div class="drop" id="d1"><h3>1. Receipts list</h3>
        <p>Receipt No., Party Name, Mode, Type, Date, Amount</p>
        <label class="pick">Choose file<input type="file" id="f1" accept=".csv,.xlsx,.xls"></label>
        <div id="s1" style="margin-top:10px;font-size:12px;color:var(--ink3)"></div></div>
      <div class="drop" id="d2"><h3>2. Customer outstanding</h3>
        <p>Party Name, Opening Balance, Debit, Credit, Closing</p>
        <label class="pick">Choose file<input type="file" id="f2" accept=".csv,.xlsx,.xls"></label>
        <div id="s2" style="margin-top:10px;font-size:12px;color:var(--ink3)"></div></div>
    </div>
    <div id="err"></div>
  </div>
  <div id="out" style="display:none"></div>
</div>
<div class="ov" id="ov"><div class="panel">
  <div class="ph"><h3 id="pt"></h3><span class="x" id="px">&times;</span></div>
  <div class="pb" id="pbody"></div></div></div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  return (n<0?'-':'')+'\u20B9'+Math.abs(Math.round(n)).toLocaleString('en-IN')}
function err(m){$('err').innerHTML=m?'<div class="err">'+esc(m)+'</div>':''}

/* leading dot = non-GST ledger; ". A2Z PUMPS" and "A2Z PUMPS" must never merge */
function pkey(n){var s=String(n||'').trim();if(!s)return '';
  var wo=s.charAt(0)==='.';if(wo)s=s.slice(1);
  return (wo?'wo:':'w:')+s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
function num(v){if(v===null||v===undefined)return 0;
  var n=Number(String(v).replace(/[,\s\u20B9]/g,''));return isFinite(n)?n:0}
function dnorm(v){var s=String(v||'').trim();
  var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return s.slice(0,10)}
function daysAgo(iso){if(!iso||iso.length<10)return null;
  var d=new Date(iso+'T00:00:00');if(isNaN(d))return null;
  return Math.floor((new Date()-d)/86400000)}

function readFile(file,cb,fail){
  var n=(file.name||'').toLowerCase(),r=new FileReader();
  r.onerror=function(){fail('Could not read '+file.name)};
  if(n.slice(-4)==='.csv'){r.onload=function(e){try{cb(parseCsv(e.target.result))}
    catch(x){fail(x.message)}};r.readAsText(file);return}
  if(typeof XLSX==='undefined'){fail('Excel support did not load. Save as CSV and retry.');return}
  r.onload=function(e){try{
    var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''}));
  }catch(x){fail('Could not read that workbook: '+x.message)}};
  r.readAsArrayBuffer(file);
}
function parseCsv(t){var rows=[],row=[],cur='',q=false;
  for(var i=0;i<t.length;i++){var c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r')cur+=c}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows}
function findHeader(rows,needles){
  for(var i=0;i<Math.min(rows.length,15);i++){
    var j=(rows[i]||[]).map(function(x){return String(x).trim().toLowerCase().replace(/\.$/,'')});
    for(var k=0;k<needles.length;k++)if(j.indexOf(needles[k])>=0)return {row:i,map:j}}
  return null}

$('f1').onchange=function(){var f=this.files[0];if(!f)return;err('');$('s1').textContent='reading…';
  readFile(f,function(rows){
    var h=findHeader(rows,['receipt no']);
    if(!h){err('No "Receipt No." column in '+f.name);$('s1').textContent='';return}
    var H={};h.map.forEach(function(k,i){if(k)H[k]=i});
    if(H['party name']===undefined||H['type']===undefined||H['amount']===undefined){
      err('Missing Party Name, Type or Amount.');$('s1').textContent='';return}
    var out=[],tot=0,fl=0;
    for(var i=h.row+1;i<rows.length;i++){var r=rows[i]||[];
      var no=String(r[H['receipt no']]||'').trim();if(!no)continue;
      var type=String(r[H['type']]||'').trim(),party=String(r[H['party name']]||'').trim();
      var amt=num(r[H['amount']]),ab=/^against bill$/i.test(type);
      tot+=amt;if(!ab)fl+=amt;
      out.push({no:no,party:party,key:(party&&party!=='-')?pkey(party):'',type:type,amt:amt,
        date:dnorm(r[H['date']]),mode:String(r[H['mode']]||'').trim(),against:ab,
        status:String(r[H['status']]||'').trim()})}
    REC=out;$('d1').className='drop ok';
    $('s1').innerHTML='<b>'+out.length.toLocaleString('en-IN')+'</b> receipts · '+rs(tot)+
      ' total · '+rs(fl)+' unallocated';
    if(LED)build();
  },function(m){err(m);$('s1').textContent=''})};

$('f2').onchange=function(){var f=this.files[0];if(!f)return;err('');$('s2').textContent='reading…';
  readFile(f,function(rows){
    var h=findHeader(rows,['closing','closing balance']);
    if(!h){err('No "Closing" column in '+f.name);$('s2').textContent='';return}
    var H={};h.map.forEach(function(k,i){if(k)H[k]=i});
    var cl=H['closing']!==undefined?H['closing']:H['closing balance'];
    if(H['party name']===undefined||cl===undefined){
      err('Missing Party Name or Closing.');$('s2').textContent='';return}
    var out={},n=0,pos=0,neg=0;
    for(var i=h.row+1;i<rows.length;i++){var r=rows[i]||[];
      var p=String(r[H['party name']]||'').trim();if(!p)continue;
      var c=num(r[cl]);
      out[pkey(p)]={name:p,close:c,open:num(r[H['opening balance']]),
        deb:num(r[H['debit']]),cre:num(r[H['credit']]),
        loc:String(r[H['location']]||'').trim(),
        phone:String(r[H['contact no']]||'').trim()};
      n++;if(c>0)pos+=c;else neg+=c}
    LED=out;$('d2').className='drop ok';
    $('s2').innerHTML='<b>'+n.toLocaleString('en-IN')+'</b> parties · receivable '+rs(pos)+
      ' · credit '+rs(Math.abs(neg));
    if(REC)build();
  },function(m){err(m);$('s2').textContent=''})};

/* ── join the two ── */
function build(){
  var m={};
  REC.forEach(function(r){
    if(!r.key)return;
    if(!m[r.key])m[r.key]={key:r.key,name:r.party,lane:r.key.indexOf('wo:')===0?'WO':'W',
      all:[],ab:0,oa:0,ad:0,nab:0,noa:0,nad:0};
    var x=m[r.key];x.all.push(r);
    if(r.against){x.ab+=r.amt;x.nab++}
    else if(/on account/i.test(r.type)){x.oa+=r.amt;x.noa++}
    else{x.ad+=r.amt;x.nad++}
  });
  /* ledger parties with no receipts still matter — they owe and have paid nothing */
  Object.keys(LED).forEach(function(k){
    if(!m[k])m[k]={key:k,name:LED[k].name,lane:k.indexOf('wo:')===0?'WO':'W',
      all:[],ab:0,oa:0,ad:0,nab:0,noa:0,nad:0};
  });
  P=Object.keys(m).map(function(k){
    var x=m[k],l=LED[k]||null;
    x.led=l;
    x.float=x.oa+x.ad;                       // money not tied to any bill
    x.recTotal=x.ab+x.oa+x.ad;
    x.close=l?l.close:null;                  // TRUE outstanding, ledger is authoritative
    /* bills still showing open = true owed + money never tagged to a bill */
    x.apparent=(x.close===null)?null:x.close+x.float;
    x.recon=(l===null)?null:Math.round((l.cre-x.recTotal)*100)/100;
    if(x.close===null)x.grp='noledger';
    else if(x.close<-0.5)x.grp='credit';
    else if(x.float<=0.5)x.grp='clean';
    else if(x.float>=x.close-1)x.grp='quick';
    else x.grp='partial';
    x.oldest=null;
    x.all.forEach(function(r){if(!r.against){var d=daysAgo(r.date);
      if(d!==null&&(x.oldest===null||d>x.oldest))x.oldest=d}});
    return x;
  });
  render();
}
function S(a,f){return a.reduce(function(s,x){return s+(f(x)||0)},0)}

/* ── overview + list ── */
function render(){
  var withLed=P.filter(function(x){return x.led});
  var owed=S(withLed.filter(function(x){return x.close>0}),function(x){return x.close});
  var flo=S(withLed.filter(function(x){return x.close>0}),function(x){return x.float});
  var appar=owed+flo;
  var quick=P.filter(function(x){return x.grp==='quick'});
  var partial=P.filter(function(x){return x.grp==='partial'});
  var credit=P.filter(function(x){return x.grp==='credit'});
  var nold=P.filter(function(x){return x.grp==='noledger'});
  var offs=P.filter(function(x){return x.recon!==null&&Math.abs(x.recon)>1});

  var h='<div class="hint big">Against Bill receipts are already tied to invoices. '+
    '<b>On Account</b> and <b>Advance Payment</b> are not — that money has reduced the party '+
    'ledger but is not attached to any bill, so those bills still look unpaid.<br><br>'+
    '<b>'+rs(appar)+'</b> of bills appear open, but only <b>'+rs(owed)+'</b> is truly owed. '+
    'The other <b>'+rs(flo)+'</b> ('+Math.round(flo/appar*100)+'%) is already in your bank — '+
    'it just needs tagging.</div>';

  h+='<div class="cards">'+
    card('Truly owed','g',rs(owed),'ledger closing balances — this is the real number')+
    card('Money to tag','a',rs(flo),'On Account + Advance sitting untagged')+
    card('Bills showing open','r',rs(appar),'what invoice-level ageing would report')+
    card('Quick wins','g',quick.length,'the float covers the balance — '+
      rs(S(quick,function(x){return Math.max(0,Math.min(x.float,x.close))}))+' clears')+
    card('Credit balances','a',credit.length,rs(S(credit,function(x){return -x.close}))+
      ' — likely an unbilled delivery')+
    card('Reconciles','',(withLed.length-offs.length)+' / '+withLed.length,
      offs.length?offs.length+' parties differ by '+rs(S(offs,function(x){return Math.abs(x.recon)})):
      'ledger credit matches receipts exactly')+
    '</div>';

  /* age of the floating money */
  var buck=[{l:'0–30 days',v:0},{l:'31–90',v:0},{l:'91–180',v:0},{l:'over 180',v:0,old:1}];
  REC.forEach(function(r){if(r.against||!r.key)return;var d=daysAgo(r.date);if(d===null)return;
    buck[d<=30?0:d<=90?1:d<=180?2:3].v+=r.amt});
  var mx=Math.max.apply(null,buck.map(function(b){return b.v}))||1;
  h+='<div class="sec" style="margin-top:22px">How long the untagged money has been sitting</div>'+
    '<div class="bars">'+buck.map(function(b){
      return '<div class="b'+(b.old?' old':'')+'" style="height:'+
        Math.max(3,b.v/mx*100)+'%"><em>'+rs(b.v)+'</em><span>'+b.l+'</span></div>';
    }).join('')+'</div>';

  h+='<div class="tabs">'+
    tab('all','All parties',P.length)+
    tab('quick','Quick wins',quick.length)+
    tab('partial','Partly covered',partial.length)+
    tab('credit','Credit balance',credit.length)+
    tab('noledger','Not in ledger',nold.length)+
    tab('off','Does not reconcile',offs.length)+
    '</div>';
  h+='<div class="bar"><input type="text" id="q" placeholder="Filter by party name…">'+
    '<button class="btn" id="csv">Download list</button><div class="spacer"></div>'+
    '<button class="btn" id="again">Load different files</button></div><div id="tbl"></div>';

  $('out').innerHTML=h;$('out').style.display='block';$('load').style.display='none';
  $('meta').textContent=REC.length.toLocaleString('en-IN')+' receipts · '+
    Object.keys(LED).length.toLocaleString('en-IN')+' ledger parties';
  document.querySelectorAll('.tab[data-t]').forEach(function(el){el.onclick=function(){
    TAB=this.getAttribute('data-t');
    document.querySelectorAll('.tab').forEach(function(x){x.className='tab'});
    this.className='tab on';drawList()}});
  $('q').oninput=drawList;$('csv').onclick=dl;
  $('again').onclick=function(){location.reload()};
  $('px').onclick=function(){$('ov').className='ov'};
  drawList();
}
function card(l,c,v,s){return '<div class="card '+(c||'')+'"><div class="l">'+l+'</div>'+
  '<div class="v">'+v+'</div><div class="s">'+s+'</div></div>'}
function tab(id,l,n){return '<div class="tab'+(TAB===id?' on':'')+'" data-t="'+id+'">'+l+
  '<span class="n">'+n+'</span></div>'}

function listRows(){
  var r=P;
  if(TAB==='off')r=P.filter(function(x){return x.recon!==null&&Math.abs(x.recon)>1});
  else if(TAB!=='all')r=P.filter(function(x){return x.grp===TAB});
  var f=($('q')&&$('q').value||'').trim().toUpperCase();
  if(f)r=r.filter(function(x){return String(x.name).toUpperCase().indexOf(f)>=0});
  return r.slice().sort(function(a,b){
    var av=SORT==='float'?a.float:SORT==='owed'?(a.close||0):a.recTotal;
    var bv=SORT==='float'?b.float:SORT==='owed'?(b.close||0):b.recTotal;
    return DIR==='desc'?bv-av:av-bv});
}
function drawList(){
  var rows=listRows();
  if(!rows.length){$('tbl').innerHTML='<div class="empty">Nothing here.</div>';return}
  var note='';
  if(TAB==='quick')note='<div class="hint">The untagged money <b>covers the whole balance</b>. '+
    'Tagging these receipts against the open bills clears the account outright.</div>';
  if(TAB==='credit')note='<div class="hint">These parties have paid <b>more than they were '+
    'billed</b>. That usually means goods went out without an invoice — check for a missing '+
    'bill before treating it as an advance.</div>';
  if(TAB==='noledger')note='<div class="hint">Receipts exist but the party is absent from the '+
    'outstanding report. Most likely the <b>name is spelt differently</b> in the two reports, '+
    'or the account was closed after the report ran.</div>';
  if(TAB==='off')note='<div class="hint">For these parties the ledger <b>Credit</b> column does '+
    'not equal the sum of their receipts. The difference is usually a credit note or a journal '+
    'entry rather than a receipt — worth checking before allocating.</div>';
  var h=note+'<table class="t"><thead><tr><th data-s="name">Party</th>'+
    '<th class="num" data-s="owed">Truly owed</th>'+
    '<th class="num" data-s="float">To tag</th>'+
    '<th class="num">Bills look open</th><th>Cover</th>'+
    '<th class="num">Receipts</th><th class="num">Oldest</th></tr></thead><tbody>';
  rows.slice(0,500).forEach(function(x){
    var cov = x.close===null?'<span class="pill p-none">no ledger</span>'
      : x.close<-0.5?'<span class="pill p-over">credit</span>'
      : x.float<=0.5?'<span class="pill p-none">nothing to tag</span>'
      : x.float>=x.close-1?'<span class="pill p-full">covers it</span>'
      : '<span class="pill p-part">'+Math.round(x.float/x.close*100)+'%</span>';
    h+='<tr data-k="'+esc(x.key)+'"><td class="nm"><span class="lane '+x.lane.toLowerCase()+
      '">'+x.lane+'</span>'+esc(x.name)+'</td>'+
      '<td class="num'+(x.close<0?' neg':'')+'">'+(x.close===null?'—':rs(x.close))+'</td>'+
      '<td class="num">'+(x.float?rs(x.float):'—')+'</td>'+
      '<td class="num">'+(x.apparent===null?'—':rs(x.apparent))+'</td>'+
      '<td>'+cov+'</td><td class="num">'+x.all.length+'</td>'+
      '<td class="num">'+(x.oldest===null?'—':x.oldest+'d')+'</td></tr>';
  });
  h+='</tbody></table>';
  if(rows.length>500)h+='<div class="empty">Showing 500 of '+rows.length+'.</div>';
  $('tbl').innerHTML=h;
  document.querySelectorAll('.t tbody tr[data-k]').forEach(function(tr){
    tr.onclick=function(){detail(this.getAttribute('data-k'))}});
  document.querySelectorAll('.t th[data-s]').forEach(function(th){
    th.onclick=function(){var s=this.getAttribute('data-s');
      if(SORT===s)DIR=DIR==='desc'?'asc':'desc';else{SORT=s;DIR='desc'}drawList()}});
}

/* ── the party drill-down ── */
function detail(k){
  var x=null;for(var i=0;i<P.length;i++)if(P[i].key===k){x=P[i];break}
  if(!x)return;
  var l=x.led;
  $('ov').className='ov on';
  $('pt').innerHTML='<span class="lane '+x.lane.toLowerCase()+'">'+x.lane+'</span>'+esc(x.name);

  var h='';

  /* the verdict, first, in words */
  if(!l){
    h+='<div class="verdict warn"><b>Not in the outstanding report.</b> '+
      rs(x.float)+' of untagged receipts exist for this name, but the party does not appear '+
      'in the ledger export. Check whether the name is spelt differently there — '+
      'the two reports must agree before this money can be allocated.</div>';
  } else if(l.close<-0.5){
    h+='<div class="verdict bad"><b>Credit balance of '+rs(-l.close)+'.</b> '+
      'They have paid more than they have been billed. '+
      (x.float>0.5?'Of that, '+rs(x.float)+' is untagged. ':'')+
      'Before treating this as an advance, check whether goods went out without an invoice — '+
      'that is the usual cause.</div>';
  } else if(x.float<=0.5){
    h+='<div class="verdict good"><b>Nothing to allocate.</b> Every receipt from this party is '+
      'already tagged Against Bill. '+(l.close>0.5?'They still owe '+rs(l.close)+
      ', which is genuinely unpaid.':'The account is square.')+'</div>';
  } else if(x.float>=l.close-1){
    var spare=x.float-l.close;
    h+='<div class="verdict good"><b>Tagging clears this account.</b> '+rs(x.float)+
      ' is sitting untagged against a balance of '+rs(l.close)+'. '+
      'Applying it against the open bills takes the account to zero'+
      (spare>1?', leaving '+rs(spare)+' as a genuine advance':'')+'.</div>';
  } else {
    h+='<div class="verdict warn"><b>Tagging covers '+Math.round(x.float/l.close*100)+
      '% of the balance.</b> '+rs(x.float)+' is untagged against '+rs(l.close)+' owed. '+
      'After allocating, '+rs(l.close-x.float)+' remains genuinely outstanding and worth '+
      'chasing.</div>';
  }

  /* what allocation does, as a flow */
  if(l&&x.float>0.5){
    h+='<div class="sec">What allocation changes</div><div class="flow">'+
      '<div class="fb"><div class="l">Bills look open</div><div class="v">'+
        rs(x.apparent)+'</div></div><div class="fa">&minus;</div>'+
      '<div class="fb"><div class="l">Money tagged</div><div class="v">'+
        rs(x.float)+'</div></div><div class="fa">=</div>'+
      '<div class="fb" style="background:var(--green-bg)"><div class="l">Truly owed</div>'+
        '<div class="v">'+rs(l.close)+'</div></div></div>'+
      '<div class="meta" style="margin-bottom:4px">The ledger balance does not move — it '+
      'already counts this money. What changes is which bills show as unpaid.</div>';
  }

  h+='<div class="g2">';

  /* ledger side */
  h+='<div><div class="sec">Ledger — the authoritative balance</div><div class="kv">';
  if(l){
    h+=row('Opening balance',rs(l.open))+
       row('Billed in period (debit)',rs(l.deb))+
       row('Received in period (credit)',rs(l.cre))+
       '<div class="r tot"><span class="k">Closing — truly owed</span><span class="v'+
       (l.close<0?' neg':'')+'">'+rs(l.close)+'</span></div>';
    if(l.loc)h+=row('Location',esc(l.loc));
    if(l.phone)h+=row('Contact',esc(l.phone));
  } else h+='<div class="r"><span class="k">Not present in the outstanding report</span></div>';
  h+='</div>';

  if(l&&Math.abs(x.recon)>1){
    h+='<div class="verdict warn" style="margin-top:12px;font-size:12.5px">'+
      '<b>Does not reconcile.</b> The ledger shows '+rs(l.cre)+' received, but the receipts '+
      'list totals '+rs(x.recTotal)+' — a difference of '+rs(Math.abs(x.recon))+
      '. That is usually a credit note or journal entry rather than a receipt.</div>';
  }

  /* receipts side */
  h+='</div><div><div class="sec">Receipts</div><div class="kv">'+
    row('Against Bill — already tagged','<span class="tg tg-ab">'+x.nab+'</span> '+rs(x.ab))+
    row('On Account — untagged','<span class="tg tg-oa">'+x.noa+'</span> '+rs(x.oa))+
    row('Advance Payment — untagged','<span class="tg tg-ad">'+x.nad+'</span> '+rs(x.ad))+
    '<div class="r tot"><span class="k">Total received</span><span class="v">'+
      rs(x.recTotal)+'</span></div>'+
    '</div>';
  if(x.float>0.5){
    h+='<div class="kv" style="margin-top:10px">'+
      row('To allocate','<b>'+rs(x.float)+'</b>')+
      row('Oldest untagged receipt',(x.oldest===null?'—':x.oldest+' days ago'))+'</div>';
  }
  h+='</div></div>';

  /* every receipt */
  if(x.all.length){
    var srt=x.all.slice().sort(function(a,b){return a.date<b.date?1:-1});
    h+='<div class="sec">Every receipt from this party ('+x.all.length+')</div>'+
      '<table class="mini"><thead><tr><th>Receipt</th><th>Date</th><th>Mode</th>'+
      '<th>Type</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>';
    srt.forEach(function(r){
      var tg=r.against?'tg-ab':(/on account/i.test(r.type)?'tg-oa':'tg-ad');
      h+='<tr><td>'+esc(r.no)+'</td><td>'+esc(r.date)+'</td><td>'+esc(r.mode)+'</td>'+
        '<td><span class="tg '+tg+'">'+esc(r.type)+'</span></td>'+
        '<td class="num">'+rs(r.amt)+'</td><td>'+esc(r.status)+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  /* what we cannot show yet, said plainly */
  h+='<div class="hint" style="margin-top:18px">Invoice-level detail — which specific bills '+
    'these receipts should be tagged against — needs the sales invoice pull to finish. '+
    'Until then this shows the party position, which is enough to decide <b>how much</b> to '+
    'allocate, but not <b>to which bill</b>.</div>';

  $('pbody').innerHTML=h;
  $('pbody').parentNode.parentNode.scrollTop=0;
}
function row(k,v){return '<div class="r"><span class="k">'+k+'</span><span class="v">'+v+
  '</span></div>'}

function dl(){
  var rows=listRows();
  var out=[['party','lane','truly_owed','to_tag','bills_look_open','cover',
    'receipts_total','against_bill','on_account','advance','oldest_untagged_days','reconciles']];
  rows.forEach(function(x){
    out.push([x.name,x.lane,x.close===null?'':Math.round(x.close),Math.round(x.float),
      x.apparent===null?'':Math.round(x.apparent),
      x.close===null?'no ledger':x.close<-0.5?'credit':x.float<=0.5?'nothing to tag':
        x.float>=x.close-1?'covers it':Math.round(x.float/x.close*100)+'%',
      Math.round(x.recTotal),Math.round(x.ab),Math.round(x.oa),Math.round(x.ad),
      x.oldest===null?'':x.oldest,
      x.recon===null?'':(Math.abs(x.recon)<=1?'yes':'off by '+Math.round(x.recon))]);
  });
  var csv=out.map(function(r){return r.map(function(c){var s=String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='VT_receivables_'+TAB+'_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
